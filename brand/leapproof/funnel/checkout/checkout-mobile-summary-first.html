<!-- Leapproof checkout · mobile: show the order-summary column FIRST (above the form/card details).
     Paste into ONE Custom HTML element on the CHECKOUT page (in addition to the main checkout block).
     Safe: it only reorders the column that holds the order summary AND does NOT hold the pay button,
     so the "Complete my order" button always stays with the form. Desktop layout is untouched. -->
<style>
@media(max-width:600px){
  .lpk-ckrow{display:flex!important;flex-direction:column!important}
  .lpk-ckrow > .lpk-sumcol{order:-1!important}
}
</style>
<script>
(function(){
  function run(){
    var sumEl=document.querySelector('.order-summary.__open')||document.getElementById('lpk-2')||document.querySelector('.order-summary');
    if(!sumEl) return false;
    var row=sumEl.closest('.section_row'); if(!row) return false;
    var cols=[].filter.call(row.children,function(c){return c.classList && c.classList.contains('row-column');});
    if(cols.length<2) return false;
    var sum=null;
    cols.forEach(function(c){
      var hasBtn=c.querySelector('button,input[type=submit],input[type=button]') || /Checkout Now|Complete my order|Place order|Pay now/i.test(c.textContent||'');
      if((c.querySelector('.order-summary')||c.querySelector('#lpk-2')) && !hasBtn) sum=c;
    });
    if(!sum) return false;               /* summary column also holds the button -> do NOT reorder */
    row.classList.add('lpk-ckrow'); sum.classList.add('lpk-sumcol');
    return true;
  }
  var n=0;(function loop(){ if(run()||++n>40) return; setTimeout(loop,300); })();
})();
</script>
