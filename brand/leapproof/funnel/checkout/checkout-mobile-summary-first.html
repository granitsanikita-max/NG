<!-- Leapproof checkout · mobile: move the "Your order" recap (delivery date + products + total) to the TOP,
     above the form/card details. Paste into ONE Custom HTML element on the CHECKOUT page (with the main checkout block).
     Moves only our own recap block (#lpk-2) — never the form, payment fields or pay button. Desktop is untouched.
     Waits ~1.5s first so the main checkout block has finished placing the recap, then captures its home position. -->
<script>
(function(){
  var lpk2, par, next, cap=false, main;
  function apply(){
    lpk2=document.getElementById('lpk-2'); main=document.querySelector('.main-wrapper');
    if(!lpk2||!main) return;
    if(!cap){ par=lpk2.parentNode; next=lpk2.nextSibling; cap=true; }   /* remember where it lives (desktop home) */
    if(window.innerWidth<=600){
      var header=document.getElementById('lpk-1');
      if(header && header.parentNode){
        if(header.nextElementSibling!==lpk2) header.parentNode.insertBefore(lpk2, header.nextSibling);
      } else {
        if(main.firstElementChild!==lpk2) main.insertBefore(lpk2, main.firstChild);
      }
    } else if(par){
      if(lpk2.parentNode!==par){ if(next&&next.parentNode===par) par.insertBefore(lpk2,next); else par.appendChild(lpk2); }
    }
  }
  setTimeout(function(){ var n=0;(function l(){ apply(); if(++n<25) setTimeout(l,400); })(); addEventListener('resize',apply); }, 1500);
})();
</script>
