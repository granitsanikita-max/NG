function render(){
  if(i<0){ intro(); return; }
  var s = Q[i];
  if(s.card==='load'){ W.innerHTML=head(null,0); loader(); return; }

  var html='<div class="fade">'+head(s.ch,num)+'<h2>'+s.t+'</h2>'+(s.s?'<p class="sub">'+s.s+'</p>':'<div style="height:16px"></div>')+

  var im=IMG[s.id], useImg=im&&s.o.filter(function(o){return im[o[0]]}).length>=s.o.filter(function(o){return o[0]!=='o'}).length;
  var imgOpts=useImg?s.o.filter(function(o){return im[o[0]]}):[], txtOpts=useImg?s.o.filter(function(o){return !im[o[0]]}):s.o;
  function tile(o){ var on = s.multi ? (cur||[]).indexOf(o[0])>-1 : cur===o[0];

  function row(o){ var on = s.multi ? (cur||[]).indexOf(o[0])>-1 : cur===o[0];
    return '<button type="button" class="opt'+(s.multi?' multi':'')+(on?' on':'')+'" data-c="'+o[0]+'"><span class="ck"></span><span>'+o[1]+(typeof o[2]==='string'?'<small>'+o[2]+'</small>':'')+'</span></button>'; }
  if(useImg){ html=html.replace(/<div class="opts[^"]*">$/,'<div class="tiles">'); imgOpts.forEach(function(o){html+=tile(o)}); html+='</div>'; if(txtOpts.length){ html+='<div class="opts" style="margin-top:12px">'; txtOpts.forEach(function(o){html+=row(o)}); html+='</div>'; } }
  else { txtOpts.forEach(function(o){html+=row(o)}); html+='</div>'; }
  if(s.multi) html+='<button class="btn" type="button" id="lpq-go" '+((cur&&cur.length)?'':'disabled')+'>Continue</button>';
  W.innerHTML=html+'</div>';

        W.querySelectorAll('.opt').forEach(function(x){x.classList.remove('on')}); b.classList.add('on');
        setTimeout(lpqNext,260);
      }
    });
  });
  var g=document.getElementById('lpq-go'); if(g) g.addEventListener('click',lpqNext);
}
