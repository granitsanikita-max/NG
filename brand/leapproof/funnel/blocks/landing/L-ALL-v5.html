<!-- Leapproof landing v5.2 · ONE block · paste into a SINGLE Custom HTML element anywhere on the landing page.
     (1) swaps the hero headline to the all-angle line, (2) always-on mobile sticky CTA (hides the old one),
     (3) hides the fake review carousel and drops our 3 real reviews TEXT-ONLY in that spot,
     (4) on mobile moves the heading ABOVE the hero image so the full heading shows first.
     The "plain black briefs" product section is a SEPARATE block (L8) placed below the hero. -->
<style>
#lp5bar{position:fixed;left:0;right:0;bottom:0;z-index:99999;background:#F5EDE6;border-top:1px solid #E7CFC9;padding:10px 14px calc(10px + env(safe-area-inset-bottom));display:none;align-items:center;gap:12px;font-family:'Hanken Grotesk',Arial,sans-serif;box-shadow:0 -6px 18px rgba(35,16,23,.08)}
#lp5bar span{font-size:14px;color:rgba(35,16,23,.75);white-space:nowrap}
#lp5bar a{flex:1;text-align:center;background:#A33154;color:#fff;text-decoration:none;font-weight:700;font-size:17px;padding:14px 16px;min-height:48px;border-radius:0}
@media (min-width:821px){#lp5bar{display:none!important}}
.el-949049 .paragraph-inner p{margin:0 0 2px!important}
#lp5-reviews{font-family:'Hanken Grotesk',Arial,sans-serif;max-width:640px;margin:14px auto 0}
#lp5-reviews .rv{background:#fff;border:1px solid #E7CFC9;border-radius:14px;padding:16px 18px;margin:0 0 12px;text-align:left}
#lp5-reviews .st{color:#D6A93B;font-size:14px;letter-spacing:2px;margin:0 0 8px}
#lp5-reviews .rv p{font-size:15px;line-height:1.5;color:#231017;margin:0 0 9px}
#lp5-reviews .cite{font-size:12.5px;color:rgba(35,16,23,.6)}
@media(max-width:600px){ .el-213716 > .element-wrapper.lp-head{ width:100%!important; padding:14px 16px 6px!important; box-sizing:border-box; } }
</style>
<div id="lp5bar"><span>About 2 min &middot; no email</span><a href="/quiz-2891028289-1791612140998314">Find my match &rsaquo;</a></div>
<script>
(function(){
  function headline(){
    var b=document.querySelector('.el-949049 .paragraph-inner');
    if(b && b.getAttribute('data-lp')!=='1'){ b.innerHTML='<p>Go ahead and sneeze.<p>No pad. No crossing your legs first.'; b.setAttribute('data-lp','1'); }
  }
  function oldbar(){ var o=document.getElementById('lp-sticky'); if(o) o.style.display='none'; }

  function rvHTML(){
    var s='<p class="st">&#9733;&#9733;&#9733;&#9733;&#9733;</p>';
    return ''
    +'<div class="rv">'+s+'<p>"Honestly almost didn’t order — I had it in my head this was more of an older-woman thing and I’m 36. But I’d just done the sneeze-at-the-worst-moment thing at school pickup, again, so I figured why not. They turned up and they’re just… plain black undies, which I wasn’t expecting. Ended up actually getting on the trampoline at my daughter’s party instead of being the mum holding everyone’s shoes. Small thing but it got me."</p><p class="cite">&mdash; Danielle R. &middot; 36 &middot; Size M</p></div>'
    +'<div class="rv">'+s+'<p>"I’ve bought two different ‘leak-proof’ ones off Instagram before and both were a letdown, so I went in expecting nothing. Only reason I even tried is you can send them back and still keep them if they’re no good, so worst case I’m out nothing. Few weeks in now and I’ve stopped chucking a backup pair in my gym bag — didn’t even notice I’d stopped until my husband asked where they’d gone."</p><p class="cite">&mdash; Sarah W. &middot; 41 &middot; Size L</p></div>'
    +'<div class="rv">'+s+'<p>"Will admit I rolled my eyes at having to do a quiz, figured it was the usual hand-over-your-email thing. It wasn’t — two minutes and it never asked for one. It put me in a size a bit bigger than I’d have grabbed myself and I nearly changed it. Glad I didn’t. They stay put, didn’t have to think about them once on my Saturday run. No idea how a few questions got it more right than I would’ve, but it did."</p><p class="cite">&mdash; Melissa K. &middot; 38 &middot; Size XL</p></div>';
  }
  function hideFakes(){
    var c=document.querySelector('.el-440165');
    if(c){ return c.closest('.element-wrapper')||c; }
    var img=document.querySelector('img[src*="SAMPLE-review"],img[data-src*="SAMPLE-review"],source[srcset*="SAMPLE-review"],source[data-srcset*="SAMPLE-review"]');
    if(img){ return img.closest('.carousel-wrapper')||img.closest('.element-wrapper'); }
    return null;
  }
  function reviews(){
    if(document.getElementById('lp5-reviews')) return true;
    var w=hideFakes();
    if(!w || !w.parentNode) return false;
    var box=document.createElement('div'); box.id='lp5-reviews'; box.innerHTML=rvHTML();
    w.parentNode.insertBefore(box, w);
    w.style.display='none';
    return true;
  }

  /* mobile: move the heading above the hero image so the full heading shows first */
  var hwrap, hrow, hpar, hnext, hcap=false;
  function moveHead(){
    var h=document.querySelector('.el-949049'), img=document.querySelector('.el-755524');
    if(!h||!img) return;
    hwrap=h.closest('.element-wrapper'); hrow=img.closest('.section_row');
    if(!hwrap||!hrow) return;
    if(!hcap){ hpar=hwrap.parentNode; hnext=hwrap.nextSibling; hwrap.classList.add('lp-head'); hcap=true; }
    if(innerWidth<=600){ if(hrow.firstElementChild!==hwrap) hrow.insertBefore(hwrap, hrow.firstChild); }
    else if(hpar && hwrap.parentNode!==hpar){ if(hnext&&hnext.parentNode===hpar) hpar.insertBefore(hwrap,hnext); else hpar.appendChild(hwrap); }
  }

  function onScreen(id){ var e=document.getElementById(id); if(!e) return false; var r=e.getBoundingClientRect(); return r.top<innerHeight && r.bottom>0; }
  function stick(){ var b=document.getElementById('lp5bar'); if(!b) return;
    b.style.display=(innerWidth<=820 && !onScreen('lp-strip-cta') && !onScreen('lp-foot-cta')) ? 'flex':'none'; }

  function run(){ headline(); oldbar(); reviews(); moveHead(); stick(); }
  var n=0;(function loop(){ run(); if(++n<30) setTimeout(loop,350); })();
  addEventListener('scroll',stick,{passive:true}); addEventListener('resize',function(){ moveHead(); stick(); });
})();
</script>
