<!-- ProudFold TOP TRUST BAR — infinite scrolling marquee (reads on every device incl. mobile). Dark bar,
     cream text, terracotta icons. Paste into a GemPages Custom Code element (replaces the top carousel bar).
     Two identical groups side by side + translateX(-50%) loop = seamless. Hover to pause. -->
<div id="pftb">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@600;700;800&display=swap');
  #pftb{--ink:#1C1B19;--cream:#F6F0E6;--terra:#D2704C;
    font-family:'Outfit',-apple-system,Segoe UI,Roboto,sans-serif;background:var(--ink);box-sizing:border-box;width:100%;overflow:hidden}
  #pftb *{margin:0;padding:0;box-sizing:border-box}
  #pftb .mq{display:flex;width:max-content;animation:pftbscroll 16s linear infinite}
  #pftb:hover .mq{animation-play-state:paused}
  #pftb .grp{display:flex;align-items:center;flex:none}
  #pftb .it{display:flex;align-items:center;gap:9px;padding:12px 0;margin:0 26px;white-space:nowrap;font-size:13.5px;font-weight:700;letter-spacing:.01em;color:var(--cream)}
  #pftb .it svg{width:17px;height:17px;stroke:var(--terra);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
  #pftb .sep{color:var(--terra);opacity:.55;font-size:7px;align-self:center}
  @keyframes pftbscroll{from{transform:translateX(0)}to{transform:translateX(-50%)}}
  @media(max-width:640px){#pftb .mq{animation-duration:10s}}
  @media(prefers-reduced-motion:reduce){#pftb .mq{animation-duration:0s}}
</style>
<div class="mq">
  <!-- group 1 -->
  <div class="grp">
    <span class="it"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M5.6 5.6l12.8 12.8"/></svg>No Subscription Trap</span><span class="sep">◆</span>
    <span class="it"><svg viewBox="0 0 24 24"><path d="M1 4h14v11H1z"/><path d="M15 8h4l3 3v4h-7z"/><circle cx="5.5" cy="18" r="2"/><circle cx="18" cy="18" r="2"/></svg>Ships From the US</span><span class="sep">◆</span>
    <span class="it"><svg viewBox="0 0 24 24"><path d="M12 2l8 4v6c0 5-3.5 8-8 10-4.5-2-8-5-8-10V6z"/><path d="M9 12l2 2 4-4"/></svg>60-Day Keep-It Comfort Guarantee</span><span class="sep">◆</span>
    <span class="it"><svg viewBox="0 0 24 24"><path d="M11 20A7 7 0 0 1 9.8 6.1C15.5 5 17 4.5 19 2c1 2.5 1.5 5-.5 8.5A7 7 0 0 1 11 20z"/><path d="M2 22c3-3 6.5-5 9-6"/></svg>Fragrance-Free &amp; Gentle</span><span class="sep">◆</span>
    <span class="it"><svg viewBox="0 0 24 24"><path d="M12 21s-7-4.5-7-10a4 4 0 0 1 7-2.5A4 4 0 0 1 19 11c0 5.5-7 10-7 10z"/></svg>Made for Plus-Size &amp; Big-Busted Folds</span><span class="sep">◆</span>
  </div>
  <!-- group 2 (identical, for seamless loop) -->
  <div class="grp">
    <span class="it"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M5.6 5.6l12.8 12.8"/></svg>No Subscription Trap</span><span class="sep">◆</span>
    <span class="it"><svg viewBox="0 0 24 24"><path d="M1 4h14v11H1z"/><path d="M15 8h4l3 3v4h-7z"/><circle cx="5.5" cy="18" r="2"/><circle cx="18" cy="18" r="2"/></svg>Ships From the US</span><span class="sep">◆</span>
    <span class="it"><svg viewBox="0 0 24 24"><path d="M12 2l8 4v6c0 5-3.5 8-8 10-4.5-2-8-5-8-10V6z"/><path d="M9 12l2 2 4-4"/></svg>60-Day Keep-It Comfort Guarantee</span><span class="sep">◆</span>
    <span class="it"><svg viewBox="0 0 24 24"><path d="M11 20A7 7 0 0 1 9.8 6.1C15.5 5 17 4.5 19 2c1 2.5 1.5 5-.5 8.5A7 7 0 0 1 11 20z"/><path d="M2 22c3-3 6.5-5 9-6"/></svg>Fragrance-Free &amp; Gentle</span><span class="sep">◆</span>
    <span class="it"><svg viewBox="0 0 24 24"><path d="M12 21s-7-4.5-7-10a4 4 0 0 1 7-2.5A4 4 0 0 1 19 11c0 5.5-7 10-7 10z"/></svg>Made for Plus-Size &amp; Big-Busted Folds</span><span class="sep">◆</span>
  </div>
</div>
</div>
