<!-- ProudFold TOP TRUST BAR — bulletproof infinite marquee (no JavaScript). Dark bar, cream text, terracotta icons.
     ONE track = two IDENTICAL halves; translateX:-50% = exactly one half, so it loops seamlessly with no overlap.
     Every item + separator is flex:0 0 auto (never shrinks) + white-space:nowrap (never wraps) => identical on
     desktop and mobile, all 5 messages always scroll. 14s desktop / 9s mobile. Hover to pause.
     Paste into a GemPages Custom Code element. -->
<div id="pftb">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@600;700;800&display=swap');
  #pftb{--ink:#1C1B19;--cream:#F6F0E6;--terra:#D2704C;
    font-family:'Outfit',-apple-system,Segoe UI,Roboto,sans-serif;background:var(--ink);box-sizing:border-box;width:100%;overflow:hidden}
  #pftb *{margin:0;padding:0;box-sizing:border-box}
  #pftb .mq{display:flex;flex-wrap:nowrap;width:max-content;align-items:center;animation:pftbscroll 14s linear infinite;will-change:transform}
  #pftb:hover .mq{animation-play-state:paused}
  #pftb .it{display:inline-flex;align-items:center;gap:9px;flex:0 0 auto;padding:12px 0;white-space:nowrap;
    font-size:13.5px;font-weight:700;letter-spacing:.01em;color:var(--cream)}
  #pftb .it svg{width:17px;height:17px;stroke:var(--terra);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
  #pftb .sep{flex:0 0 auto;margin:0 30px;color:var(--terra);opacity:.55;font-size:7px;line-height:1}
  @keyframes pftbscroll{from{transform:translateX(0)}to{transform:translateX(-50%)}}
  @media(max-width:640px){#pftb .mq{animation-duration:9s}#pftb .it{font-size:13px}#pftb .sep{margin:0 22px}}
  @media(prefers-reduced-motion:reduce){#pftb .mq{animation:none;justify-content:center}}
</style>
