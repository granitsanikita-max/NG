<!-- IRYN custom buy box v2 — paste into a GemPages Custom Code (HTML) element in the buy box.
     Both options, clean bullets, embedded guide covers with strike-through values.
     Adds Iron Strips to cart with the Recharge selling plan attached. -->
<style>
  .iryn-bb{max-width:540px;font-family:inherit;color:#2B2B2B;line-height:1.5}
  .iryn-bb *{box-sizing:border-box}
  .iryn-opt{display:block;border:2px solid #E7DCCB;border-radius:16px;padding:18px 20px;margin:0 0 14px;cursor:pointer;background:#FBF6EE;transition:border-color .15s,box-shadow .15s;position:relative}
  .iryn-opt:hover{border-color:#C8A86A}
  .iryn-opt:has(input:checked){border-color:#A0203F;box-shadow:0 0 0 3px rgba(160,32,63,.10)}
  .iryn-opt input{position:absolute;opacity:0;pointer-events:none}
  .iryn-head{display:flex;align-items:center;justify-content:space-between;gap:12px}
  .iryn-name{font-weight:700;font-size:19px;display:flex;align-items:center;gap:11px}
  .iryn-dot{width:20px;height:20px;border-radius:50%;border:2px solid #B2A79A;flex:0 0 20px}
  .iryn-opt:has(input:checked) .iryn-dot{border-color:#A0203F;background:radial-gradient(#A0203F 42%,#FBF6EE 46%)}
  .iryn-price{font-weight:800;font-size:19px;white-space:nowrap}
  .iryn-price s{color:#9A8E80;font-weight:500;margin-right:7px}
  .iryn-badge{position:absolute;top:-11px;right:18px;background:#A0203F;color:#fff;font-size:11px;font-weight:700;letter-spacing:.05em;padding:4px 11px;border-radius:999px;text-transform:uppercase}
  .iryn-rate{font-size:14px;color:#6A5F57;margin:7px 0 12px 31px}
  .iryn-ul{list-style:none;margin:0 0 0 31px;padding:0}
  .iryn-ul li{position:relative;padding:3px 0 3px 24px;font-size:14.5px}
  .iryn-ul li:before{content:"";position:absolute;left:0;top:10px;width:14px;height:8px;border-left:2.5px solid #A0203F;border-bottom:2.5px solid #A0203F;transform:rotate(-45deg)}
  .iryn-ul.plain li:before{border:0;left:6px;top:11px;width:5px;height:5px;border-radius:50%;background:#B2A79A;transform:none}
  .iryn-gifthead{margin:14px 0 8px 31px;font-weight:800;color:#A0203F;font-size:15px}
  .iryn-gift{display:flex;align-items:center;gap:12px;margin:0 0 9px 31px}
  .iryn-gift img{width:38px;height:auto;border-radius:4px;box-shadow:0 2px 6px rgba(0,0,0,.18);flex:0 0 38px}
  .iryn-gift .gn{font-size:14px;font-weight:600;flex:1}
  .iryn-gift .gp{font-size:13.5px;white-space:nowrap}
  .iryn-gift .gp s{color:#9A8E80;margin-right:6px}
  .iryn-gift .gp b{color:#A0203F;font-weight:800;letter-spacing:.03em}
  .iryn-cta{width:100%;border:0;border-radius:999px;background:#A0203F;color:#fff;font-weight:800;font-size:18px;padding:18px 20px;cursor:pointer;margin-top:6px}
  .iryn-cta:hover{background:#7C1730}
  .iryn-cta:disabled{opacity:.6;cursor:default}
  .iryn-trust{text-align:center;font-size:12.5px;color:#6A5F57;margin-top:11px}
  .iryn-pay{display:flex;justify-content:center;align-items:center;gap:7px;margin-top:12px;flex-wrap:wrap}
  .iryn-pay img{width:44px;height:28px;object-fit:contain;padding:4px 6px;border:1px solid #ECE3D5;border-radius:5px;background:#fff}
</style>

<div class="iryn-bb" id="irynBB">
  <label class="iryn-opt" data-plan="11380130113">
    <span class="iryn-badge">Best value</span>
    <input type="radio" name="iryn-plan" value="sub" checked>
    <span class="iryn-head">
      <span class="iryn-name"><span class="iryn-dot"></span>Subscribe &amp; Save</span>
      <span class="iryn-price"><s>$1.33/day</s>$1.20<span style="font-size:13px;font-weight:600">/day</span></span>
    </span>
    <div class="iryn-rate"><b style="color:#A0203F">26% off</b> your first order, then <b style="color:#A0203F">10% off</b> every month</div>
    <ul class="iryn-ul">
      <li>Free shipping</li>
      <li>Cancel anytime, one click</li>
      <li>70-day money-back promise</li>
    </ul>
    <div class="iryn-gifthead">+ $67 of guides, free</div>
    <div class="iryn-gift"><img src="https://cdn.shopify.com/s/files/1/1008/0524/7297/files/iryn-cover-know.webp"><span class="gn">Know Her Number Guide</span><span class="gp"><s>$29</s><b>FREE</b></span></div>
    <div class="iryn-gift"><img src="https://cdn.shopify.com/s/files/1/1008/0524/7297/files/iryn-cover-doc.webp"><span class="gn">Doctor-Visit Script</span><span class="gp"><s>$19</s><b>FREE</b></span></div>
    <div class="iryn-gift"><img src="https://cdn.shopify.com/s/files/1/1008/0524/7297/files/iryn-cover-her.webp"><span class="gn">Her Page + 90-Day Retest Tracker</span><span class="gp"><s>$19</s><b>FREE</b></span></div>
  </label>

  <label class="iryn-opt" data-plan="">
    <input type="radio" name="iryn-plan" value="once">
    <span class="iryn-head">
      <span class="iryn-name"><span class="iryn-dot"></span>One-time</span>
      <span class="iryn-price">$1.33<span style="font-size:13px;font-weight:600">/day</span></span>
    </span>
    <ul class="iryn-ul plain" style="margin-top:12px">
      <li>One tin, shipped once</li>
      <li>Shipping charged (about $6)</li>
      <li>No free guides</li>
      <li>70-day money-back promise</li>
    </ul>
  </label>

  <button class="iryn-cta" id="irynAdd">Get her back to full speed</button>
  <div class="iryn-trust">70-day money-back promise &middot; Cancel anytime, one click</div>
  <div class="iryn-pay"><img src="https://cdn.shopify.com/s/files/1/1008/0524/7297/files/iryn-pay-visa.svg" alt="Visa"><img src="https://cdn.shopify.com/s/files/1/1008/0524/7297/files/iryn-pay-mastercard.svg" alt="Mastercard"><img src="https://cdn.shopify.com/s/files/1/1008/0524/7297/files/iryn-pay-amex.svg" alt="American Express"><img src="https://cdn.shopify.com/s/files/1/1008/0524/7297/files/iryn-pay-applepay.svg" alt="Apple Pay"><img src="https://cdn.shopify.com/s/files/1/1008/0524/7297/files/iryn-pay-googlepay.svg" alt="Google Pay"></div>
</div>

<script>
(function(){
  var VARIANT=67600551117121, BB=document.getElementById('irynBB'); if(!BB)return;
  // Selection is native (radio + label + CSS :has). JS only handles add-to-cart.
  var btn=document.getElementById('irynAdd');
  btn.addEventListener('click',function(){
    var chk=BB.querySelector('input[name="iryn-plan"]:checked');
    var opt=chk?chk.closest('.iryn-opt'):null;
    var plan=opt?opt.getAttribute('data-plan'):'';
    var item={id:VARIANT,quantity:1}; if(plan){item.selling_plan=Number(plan);}
    btn.disabled=true;btn.textContent='Adding...';
    fetch('/cart/add.js',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({items:[item]})})
      .then(function(r){return r.json();}).then(function(){window.location.href='/checkout';})
      .catch(function(){btn.disabled=false;btn.textContent='Get her back to full speed';alert('Something went wrong, please try again.');});
  });
})();
</script>
