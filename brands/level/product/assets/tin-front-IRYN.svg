<?xml version="1.0" encoding="UTF-8"?>
<svg width="810" height="810" viewBox="0 0 810 810" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="garnet" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#B62A4C"/><stop offset="60%" stop-color="#A0203F"/><stop offset="100%" stop-color="#7C1730"/>
    </linearGradient>
    <linearGradient id="foil" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#EFCB86"/><stop offset="45%" stop-color="#D8A24A"/><stop offset="100%" stop-color="#A9762C"/>
    </linearGradient>
    <clipPath id="topClip"><polygon points="0,0 810,0 810,540 0,486"/></clipPath>
    <clipPath id="botClip"><polygon points="0,486 810,540 810,810 0,810"/></clipPath>
  </defs>

  <rect x="0" y="0" width="810" height="810" fill="#F4ECDF"/>
  <polygon points="0,0 810,0 810,540 0,486" fill="url(#garnet)"/>
  <line x1="0" y1="486" x2="810" y2="540" stroke="url(#foil)" stroke-width="4"/>

  <!-- HERO EMBLEM (logo) centered top -->
  <g>
    <rect x="333" y="88" width="144" height="150" rx="20" fill="none" stroke="url(#foil)" stroke-width="3.4"/>
    <text x="352" y="123" font-family="SG Medium" font-size="19" fill="#EFCB86">26</text>
    <text x="405" y="188" font-family="SG Bold" font-size="66" fill="#F4ECDF" text-anchor="middle">Fe</text>
    <rect x="371" y="214" width="12" height="8"  rx="2" fill="#EFCB86"/>
    <rect x="389" y="208" width="12" height="14" rx="2" fill="#EFCB86"/>
    <rect x="407" y="201" width="12" height="21" rx="2" fill="#EFCB86"/>
    <rect x="425" y="193" width="12" height="29" rx="2" fill="#EFCB86"/>
  </g>
  <!-- slogan -->
  <text x="405" y="292" font-family="SG Medium" font-size="17" fill="#F4ECDF" fill-opacity="0.85" text-anchor="middle" letter-spacing="4">KNOW HER NUMBER</text>

  <!-- STRADDLING WORDMARK -->
  <text x="405" y="548" font-family="SG Bold" font-size="196" text-anchor="middle" letter-spacing="-6" fill="#F4ECDF" clip-path="url(#topClip)">iryn</text>
  <text x="405" y="548" font-family="SG Bold" font-size="196" text-anchor="middle" letter-spacing="-6" fill="#A0203F" clip-path="url(#botClip)">iryn</text>

  <!-- deck line (clear) -->
  <text x="405" y="606" font-family="SG Medium" font-size="30" fill="#7C1730" text-anchor="middle" letter-spacing="0.5">gentle daily iron for teen girls</text>

  <!-- hero dose -->
  <text x="405" y="684" font-family="SG Bold" font-size="62" text-anchor="middle" fill="#A0203F" letter-spacing="-1">19<tspan font-size="38" fill="#B08A44">mg</tspan></text>
  <text x="405" y="712" font-family="SG Medium" font-size="15.5" fill="#6A5A3C" text-anchor="middle" letter-spacing="5">IRON &#183; ONE A DAY</text>

  <text x="405" y="752" font-family="SG Medium" font-size="14.5" fill="#6A5A3C" text-anchor="middle" letter-spacing="2.5">RASPBERRY &#183; 30 ORAL STRIPS</text>
</svg>
