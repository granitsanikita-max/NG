<?xml version="1.0" encoding="UTF-8"?>
<svg width="1200" height="860" viewBox="0 0 1200 860" xmlns="http://www.w3.org/2000/svg">
<defs>
 <filter id="sh" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="18" flood-color="#000" flood-opacity="0.12"/></filter>
 <style>text{font-family:"SG Medium","Space Grotesk";} .b{font-family:"SG Bold","Space Grotesk";}</style>
</defs>
<rect width="1200" height="860" fill="#F4ECDF"/>
<text x="600" y="78" class="b" font-size="30" fill="#A0203F" text-anchor="middle" letter-spacing="5">THE FERRITIN GAP</text>
<rect x="70" y="120" width="500" height="560" rx="30" fill="#FFF" filter="url(#sh)"/>
<text x="320" y="190" class="b" font-size="40" fill="#2B2B2B" text-anchor="middle">Hemoglobin</text>
<text x="320" y="230" font-size="24" fill="#6A6A6A" text-anchor="middle">the iron in her blood right now</text>
<rect x="190" y="300" width="260" height="170" rx="22" fill="#A0203F"/>
<rect x="190" y="300" width="260" height="60" rx="22" fill="#7C1730"/>
<rect x="230" y="270" width="80" height="60" rx="8" fill="#EAF3EE" stroke="#3E7C59" stroke-width="3"/>
<rect x="320" y="262" width="80" height="60" rx="8" fill="#EAF3EE" stroke="#3E7C59" stroke-width="3"/>
<circle cx="270" cy="300" r="12" fill="#3E7C59"/><circle cx="360" cy="292" r="12" fill="#3E7C59"/>
<rect x="400" y="370" width="34" height="34" rx="8" fill="#D8A24A"/>
<rect x="160" y="520" width="320" height="64" rx="32" fill="#EAF3EE"/>
<text x="300" y="560" class="b" font-size="25" fill="#3E7C59" text-anchor="middle">The test checks this</text>
<path d="M430 548 l12 15 l22 -30" fill="none" stroke="#3E7C59" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
<text x="320" y="635" font-size="23" fill="#6A6A6A" text-anchor="middle">Looks full. Looks fine.</text>
<rect x="630" y="120" width="500" height="560" rx="30" fill="#FFF" filter="url(#sh)"/>
<text x="880" y="190" class="b" font-size="40" fill="#2B2B2B" text-anchor="middle">Ferritin</text>
<text x="880" y="230" font-size="24" fill="#6A6A6A" text-anchor="middle">the iron she keeps in storage</text>
<rect x="800" y="285" width="160" height="40" rx="10" fill="none" stroke="#A0203F" stroke-width="6"/>
<path d="M812 325 L812 470 Q812 490 832 490 L928 490 Q948 490 948 470 L948 325 Z" fill="none" stroke="#A0203F" stroke-width="6"/>
<path d="M816 455 L816 470 Q816 486 832 486 L928 486 Q944 486 944 470 L944 455 Z" fill="#EFCB86"/>
<circle cx="860" cy="460" r="14" fill="#D8A24A"/><circle cx="900" cy="462" r="14" fill="#D8A24A"/>
<rect x="720" y="520" width="320" height="64" rx="32" fill="#F6E7EA"/>
<text x="862" y="560" class="b" font-size="25" fill="#A0203F" text-anchor="middle">The test skips this</text>
<path d="M992 547 l28 28 M1020 547 l-28 28" stroke="#A0203F" stroke-width="7" stroke-linecap="round"/>
<text x="880" y="635" font-size="23" fill="#6A6A6A" text-anchor="middle">Running on empty.</text>
<text x="600" y="790" class="b" font-size="34" fill="#7C1730" text-anchor="middle">A "normal" result can hide an empty tank.</text>
</svg>