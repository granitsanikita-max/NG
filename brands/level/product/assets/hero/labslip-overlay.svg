<?xml version="1.0" encoding="UTF-8"?>
<svg width="1000" height="560" viewBox="0 0 1000 560" xmlns="http://www.w3.org/2000/svg">
<defs>
  <filter id="sh" x="-20%" y="-20%" width="140%" height="140%">
    <feDropShadow dx="0" dy="10" stdDeviation="22" flood-color="#000000" flood-opacity="0.22"/>
  </filter>
  <style>text{font-family:"SG Medium","Space Grotesk";} .b{font-family:"SG Bold","Space Grotesk";}</style>
</defs>
<rect x="40" y="40" width="920" height="480" rx="28" fill="#FFFFFF" filter="url(#sh)"/>
<rect x="40" y="40" width="12" height="480" rx="6" fill="#A0203F"/>
<text x="86" y="112" class="b" font-size="26" fill="#6A6A6A" letter-spacing="4">BLOOD TEST RESULTS</text>
<line x1="86" y1="140" x2="916" y2="140" stroke="#E7E2D8" stroke-width="2"/>
<!-- Row 1 Hemoglobin -->
<text x="86" y="236" class="b" font-size="46" fill="#2B2B2B">Hemoglobin</text>
<text x="560" y="236" class="b" font-size="46" fill="#2B2B2B">13.2 g/dL</text>
<rect x="770" y="196" width="160" height="56" rx="28" fill="#EAF3EE"/>
<text x="850" y="233" class="b" font-size="30" fill="#3E7C59" text-anchor="middle">NORMAL</text>
<line x1="86" y1="286" x2="916" y2="286" stroke="#E7E2D8" stroke-width="2"/>
<!-- Row 2 Ferritin -->
<text x="86" y="382" class="b" font-size="46" fill="#2B2B2B">Ferritin</text>
<text x="560" y="382" class="b" font-size="46" fill="#A0203F">9 ng/mL</text>
<rect x="800" y="342" width="130" height="56" rx="28" fill="#A0203F"/>
<text x="865" y="379" class="b" font-size="30" fill="#FFFFFF" text-anchor="middle">LOW</text>
<!-- footnote -->
<text x="86" y="462" font-size="26" fill="#6A6A6A">Ferritin is her iron in storage. Most tests never check it.</text>
</svg>