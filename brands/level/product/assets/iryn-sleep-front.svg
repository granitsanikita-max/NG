  <text x="405" y="272" font-family="SG Medium" font-size="15.5" fill="#F4ECDF" fill-opacity="0.85" text-anchor="middle" letter-spacing="3">A CALM END TO A LONG DAY</text>
  <text x="405" y="536" font-family="SG Bold" font-size="188" text-anchor="middle" letter-spacing="-6" fill="#F4ECDF" clip-path="url(#topClip)">iryn</text>
