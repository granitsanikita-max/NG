<?xml version="1.0" encoding="UTF-8"?>
<svg width="810" height="810" viewBox="0 0 810 810" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="matte" cx="38%" cy="32%" r="90%">
      <stop offset="0%" stop-color="#B8472F"/>
      <stop offset="60%" stop-color="#A63D2D"/>
      <stop offset="100%" stop-color="#7E2C1F"/>
    </radialGradient>
    <linearGradient id="foil" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#E7C07A"/>
      <stop offset="45%" stop-color="#C98A3A"/>
      <stop offset="100%" stop-color="#9E6A28"/>
    </linearGradient>
  </defs>

  <!-- full bleed bg -->
  <rect x="0" y="0" width="810" height="810" fill="url(#matte)"/>

  <!-- giant ghosted Fe for depth (bleeds bottom-right) -->
  <text x="600" y="910" font-family="SG Bold" font-size="720" fill="#F2ECE1" fill-opacity="0.06" text-anchor="middle">Fe</text>

  <!-- double foil frame -->
  <rect x="62" y="62" width="686" height="686" rx="24" fill="none" stroke="url(#foil)" stroke-width="3"/>
  <rect x="76" y="76" width="658" height="658" rx="16" fill="none" stroke="#F2ECE1" stroke-opacity="0.22" stroke-width="1.2"/>

  <!-- periodic chip (top-left) -->
  <g>
    <rect x="100" y="104" width="104" height="118" rx="9" fill="none" stroke="url(#foil)" stroke-width="2.4"/>
    <text x="114" y="132" font-family="SG Medium" font-size="17" fill="#E7C07A">26</text>
    <text x="152" y="182" font-family="SG Bold" font-size="52" fill="#F2ECE1" text-anchor="middle">Fe</text>
    <text x="152" y="204" font-family="SG Medium" font-size="12.5" fill="#E7C07A" text-anchor="middle" letter-spacing="1">55.85</text>
  </g>

  <!-- top-right kicker -->
  <text x="712" y="130" font-family="SG Medium" font-size="14" fill="#F2ECE1" fill-opacity="0.72" text-anchor="end" letter-spacing="3.5">DIETARY</text>
  <text x="712" y="150" font-family="SG Medium" font-size="14" fill="#F2ECE1" fill-opacity="0.72" text-anchor="end" letter-spacing="3.5">SUPPLEMENT</text>

  <!-- hero wordmark (left, huge) -->
  <text x="98" y="402" font-family="SG Bold" font-size="164" fill="#F2ECE1" text-anchor="start" letter-spacing="-5">level</text>

  <!-- foil rule -->
  <rect x="102" y="430" width="232" height="4" rx="2" fill="url(#foil)"/>

  <!-- tagline -->
  <text x="104" y="476" font-family="SG Medium" font-size="31" fill="#F2ECE1" text-anchor="start" letter-spacing="1.5">iron for her years</text>

  <!-- number spec block -->
  <text x="102" y="606" font-family="SG Bold" font-size="82" fill="url(#foil)" text-anchor="start" letter-spacing="-1">19<tspan font-size="52">mg</tspan></text>
  <text x="110" y="642" font-family="SG Medium" font-size="18" fill="#F2ECE1" fill-opacity="0.85" text-anchor="start" letter-spacing="4">IRON &#183; ONE A DAY</text>

  <!-- bottom hairline + descriptor -->
  <line x1="100" y1="682" x2="710" y2="682" stroke="#F2ECE1" stroke-opacity="0.28" stroke-width="1"/>
  <text x="405" y="712" font-family="SG Medium" font-size="16.5" fill="#F2ECE1" fill-opacity="0.82" text-anchor="middle" letter-spacing="2.5">MADE FOR GIRLS 12+ &#183; RASPBERRY &#183; 30 ORAL STRIPS</text>
</svg>
