<?xml version="1.0" encoding="UTF-8"?>
<svg width="810" height="810" viewBox="0 0 810 810" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="garnet" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#B62A4C"/>
      <stop offset="60%" stop-color="#A0203F"/>
      <stop offset="100%" stop-color="#7C1730"/>
    </linearGradient>
    <linearGradient id="foil" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#EFCB86"/>
      <stop offset="45%" stop-color="#D8A24A"/>
      <stop offset="100%" stop-color="#A9762C"/>
    </linearGradient>
    <clipPath id="topClip"><polygon points="0,0 810,0 810,540 0,486"/></clipPath>
    <clipPath id="botClip"><polygon points="0,486 810,540 810,810 0,810"/></clipPath>
  </defs>

  <rect x="0" y="0" width="810" height="810" fill="#F4ECDF"/>
  <polygon points="0,0 810,0 810,540 0,486" fill="url(#garnet)"/>
  <text x="620" y="470" font-family="SG Bold" font-size="560" fill="#F4ECDF" fill-opacity="0.07" text-anchor="middle" clip-path="url(#topClip)">Fe</text>
  <line x1="0" y1="486" x2="810" y2="540" stroke="url(#foil)" stroke-width="4"/>

  <!-- periodic chip -->
  <g>
    <rect x="92" y="92" width="106" height="120" rx="9" fill="none" stroke="url(#foil)" stroke-width="2.6"/>
    <text x="107" y="121" font-family="SG Medium" font-size="17" fill="#EFCB86">26</text>
    <text x="145" y="173" font-family="SG Bold" font-size="54" fill="#F4ECDF" text-anchor="middle">Fe</text>
    <text x="145" y="196" font-family="SG Medium" font-size="12.5" fill="#EFCB86" text-anchor="middle" letter-spacing="1">55.85</text>
  </g>
  <text x="716" y="118" font-family="SG Medium" font-size="14" fill="#F4ECDF" fill-opacity="0.8" text-anchor="end" letter-spacing="3.5">DIETARY</text>
  <text x="716" y="138" font-family="SG Medium" font-size="14" fill="#F4ECDF" fill-opacity="0.8" text-anchor="end" letter-spacing="3.5">SUPPLEMENT</text>

  <!-- straddling wordmark -->
  <text x="405" y="545" font-family="SG Bold" font-size="196" text-anchor="middle" letter-spacing="-8" fill="#F4ECDF" clip-path="url(#topClip)">level</text>
  <text x="405" y="545" font-family="SG Bold" font-size="196" text-anchor="middle" letter-spacing="-8" fill="#A0203F" clip-path="url(#botClip)">level</text>

  <!-- CLEAR deck line -->
  <text x="405" y="596" font-family="SG Medium" font-size="30" fill="#7C1730" text-anchor="middle" letter-spacing="0.5">gentle daily iron for teen girls</text>
  <!-- positioning stamp -->
  <text x="405" y="628" font-family="SG Medium" font-size="14.5" fill="#9A5A3E" text-anchor="middle" letter-spacing="3">NOT A BIG KID &#183; NOT A SMALL WOMAN</text>

  <!-- hero dose -->
  <text x="405" y="700" font-family="SG Bold" font-size="66" text-anchor="middle" fill="#A0203F" letter-spacing="-1">19<tspan font-size="40" fill="#B08A44">mg</tspan></text>
  <text x="405" y="728" font-family="SG Medium" font-size="16" fill="#6A5A3C" text-anchor="middle" letter-spacing="5">IRON &#183; ONE A DAY</text>

  <text x="405" y="764" font-family="SG Medium" font-size="14.5" fill="#6A5A3C" text-anchor="middle" letter-spacing="2.5">RASPBERRY &#183; 30 ORAL STRIPS</text>
</svg>
