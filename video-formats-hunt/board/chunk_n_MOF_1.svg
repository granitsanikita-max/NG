<text x="96" y="1688" font-family="noto_sans" font-size="38" font-weight="bold" fill="#1a1a1a">N40  Multi-Panel Split Screen</text>
<rect x="96" y="1710" width="79" height="38" rx="19" fill="#fff6b6" stroke="none" data-content="&lt;b&gt;MOF&lt;/b&gt;" data-text-color="#8a6300" data-font-size="18" data-font-family="noto_sans" />
<rect x="187" y="1710" width="300" height="38" rx="19" fill="#1a1a1a" stroke="none" data-content="&lt;b&gt;NEW · from 7-10 fig brands&lt;/b&gt;" data-text-color="#ffffff" data-font-size="18" data-font-family="noto_sans" />
<rect x="499" y="1710" width="290" height="38" rx="19" fill="#ffffff" stroke="#e7e7e7" data-content="&lt;b&gt;5 winning ads · 4 brands&lt;/b&gt;" data-text-color="#595959" data-font-size="18" data-font-family="noto_sans" />
<textArea x="96" y="1766" width="1900" height="359" font-family="noto_sans" font-size="21" fill="#595959">&lt;p&gt;&lt;b&gt;What it is:&lt;/b&gt; The vertical frame is cut into 2-9 panels that all play at the same time for the whole ad: e.g. on-model 360 spin, macro fabric/detail loop, back view, several body types or several outfits, with a small brand/product label or one title tile (&amp;#x27;Fall &amp;#x27;26 is here&amp;#x27;, &amp;#x27;Stretchy jeans will change your life&amp;#x27;); no VO or presenter, 6-15s.&lt;/p&gt;&lt;p&gt;&lt;b&gt;Why it works:&lt;/b&gt; Shows fit, detail, movement and range in one glance with no edit for the eye to wait on, so it works as a richer catalog ad; best for apparel, underwear and anything where fit plus texture sells.&lt;/p&gt;&lt;p&gt;&lt;b&gt;How to make one:&lt;/b&gt; 1) Shoot 3-4 short clips of the same product: on-model spin, back view, close-up texture/detail, and a second model or colourway. 2) Stack them as 3-4 horizontal panels (or a 3x3 grid for a collection) all looping at once, aligned to the same beat. 3) Add the brand + product name (or one headline tile) and keep it 6-15s with no VO.&lt;/p&gt;&lt;p&gt;&lt;b&gt;Closest format already on the board:&lt;/b&gt; Try-On Haul [MOF] - a haul shows one creator trying pieces one after another with talking; here several silent views play at the same time in split panels, like a moving catalog page.&lt;/p&gt;</textArea>
<rect x="96" y="2149" width="360" height="640" rx="8" fill="#1a1a1a" stroke="none" />
