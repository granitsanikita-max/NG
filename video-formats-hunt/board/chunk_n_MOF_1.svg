<rect x="2092" y="1618" width="1964" height="1346" rx="16" fill="#f7f7f7" stroke="none" />
<text x="2124" y="1688" font-family="noto_sans" font-size="38" font-weight="bold" fill="#1a1a1a">N41  Not For Everyone (Reverse Qualifier)</text>
<rect x="2124" y="1710" width="79" height="38" rx="19" fill="#fff6b6" stroke="none" data-content="&lt;b&gt;MOF&lt;/b&gt;" data-text-color="#8a6300" data-font-size="18" data-font-family="noto_sans" />
<rect x="2215" y="1710" width="300" height="38" rx="19" fill="#1a1a1a" stroke="none" data-content="&lt;b&gt;NEW · from 7-10 fig brands&lt;/b&gt;" data-text-color="#ffffff" data-font-size="18" data-font-family="noto_sans" />
<rect x="2527" y="1710" width="290" height="38" rx="19" fill="#ffffff" stroke="#e7e7e7" data-content="&lt;b&gt;5 winning ads · 3 brands&lt;/b&gt;" data-text-color="#595959" data-font-size="18" data-font-family="noto_sans" />
<textArea x="2124" y="1766" width="1900" height="390" font-family="noto_sans" font-size="21" fill="#595959">&lt;p&gt;&lt;b&gt;What it is:&lt;/b&gt; Opens with reverse psychology - &amp;#x27;Don&amp;#x27;t buy X&amp;#x27;, &amp;#x27;3 reasons you SHOULDN&amp;#x27;T buy X&amp;#x27;, &amp;#x27;Honestly, this isn&amp;#x27;t for everyone&amp;#x27; - then runs a list of sarcastic or tongue-in-cheek disqualifiers (&amp;#x27;if you&amp;#x27;re okay with blades that dull in months&amp;#x27;, &amp;#x27;if the pharmacy creams are working&amp;#x27;, &amp;#x27;you&amp;#x27;re just not that into glowing skin (said no one ever)&amp;#x27;), each one secretly a benefit, before flipping to &amp;#x27;but if you want...&amp;#x27; and closing on proof plus a guarantee/CTA.&lt;/p&gt;&lt;p&gt;&lt;b&gt;Why it works:&lt;/b&gt; The &amp;#x27;don&amp;#x27;t buy&amp;#x27; hook breaks ad blindness and makes the viewer qualify themselves in, so the pitch feels like honest filtering rather than selling; great for premium-priced products and markets tired of hype.&lt;/p&gt;&lt;p&gt;&lt;b&gt;How to make one:&lt;/b&gt; 1) Open on a &amp;#x27;Don&amp;#x27;t buy [product] if...&amp;#x27; / &amp;#x27;This isn&amp;#x27;t for everyone&amp;#x27; line on the hero shot or a creator to camera. 2) List 3-5 disqualifiers that are really the pains your product solves (shown as captions, sticky notes or product demo shots, each with a wink). 3) Flip to &amp;#x27;But if you want [result]...&amp;#x27;, show one proof point or mechanism, and close on the guarantee and CTA.&lt;/p&gt;&lt;p&gt;&lt;b&gt;Closest format already on the board:&lt;/b&gt; Myth Buster [TOF,MOF] - myth buster corrects a false belief; here the whole ad is framed as reasons NOT to buy, and each &amp;#x27;reason&amp;#x27; is a disguised benefit before the flip.&lt;/p&gt;</textArea>
