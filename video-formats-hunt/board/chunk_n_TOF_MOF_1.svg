<rect x="64" y="1710" width="1964" height="1315" rx="16" fill="#f7f7f7" stroke="none" />
<text x="96" y="1780" font-family="noto_sans" font-size="38" font-weight="bold" fill="#1a1a1a">N23  Before/After Transformation Reveal (Glow-Up)</text>
<rect x="96" y="1802" width="131" height="38" rx="19" fill="#e3d7ff" stroke="none" data-content="&lt;b&gt;TOF→MOF&lt;/b&gt;" data-text-color="#5a3aa8" data-font-size="18" data-font-family="noto_sans" />
<rect x="239" y="1802" width="300" height="38" rx="19" fill="#1a1a1a" stroke="none" data-content="&lt;b&gt;NEW · from 7-10 fig brands&lt;/b&gt;" data-text-color="#ffffff" data-font-size="18" data-font-family="noto_sans" />
<rect x="551" y="1802" width="290" height="38" rx="19" fill="#ffffff" stroke="#e7e7e7" data-content="&lt;b&gt;5 winning ads · 3 brands&lt;/b&gt;" data-text-color="#595959" data-font-size="18" data-font-family="noto_sans" />
<textArea x="96" y="1858" width="1900" height="359" font-family="noto_sans" font-size="21" fill="#595959">&lt;p&gt;&lt;b&gt;What it is:&lt;/b&gt; The whole ad is one transformation: opens on the &amp;#x27;before&amp;#x27; (shaggy hair in the barber chair, frizzy curls, a &amp;#x27;Day 0&amp;#x27; body/face), the middle shows the product doing the work (a pro cutting and styling with it, or an AI morph sliding from Day 0 to Day 90), and it closes on the big &amp;#x27;after&amp;#x27; reveal plus product card/offer.&lt;/p&gt;&lt;p&gt;&lt;b&gt;Why it works:&lt;/b&gt; A visible change from bad to great is the strongest proof there is and the viewer watches to see the reveal; use for hair, skin, body, cleaning or any product with a visual result. Live-action (salon/barber chair) builds trust, the AI-morph version is a cheap 10s test.&lt;/p&gt;&lt;p&gt;&lt;b&gt;How to make one:&lt;/b&gt; 1) Pick the most dramatic &amp;#x27;before&amp;#x27; you can show (real client in the chair, or an AI-generated Day 0 image) with a hook caption like &amp;#x27;every transformation…&amp;#x27; or &amp;#x27;Face fat? gone&amp;#x27;. 2) Show the product in action mid-ad: pro applying/styling it, or a smooth morph with the product pack sitting in frame. 3) Hold on the &amp;#x27;after&amp;#x27; (turn, hair flip, Day 90 label), then cut to a clean product shot with price/offer.&lt;/p&gt;&lt;p&gt;&lt;b&gt;Closest format already on the board:&lt;/b&gt; Challenge / Case Studies - those follow a person over days or break down a result in talk; here the ad is just the before → product → after reveal, either a live makeover or an AI morph.&lt;/p&gt;</textArea>
