<text x="2124" y="1780" font-family="noto_sans" font-size="38" font-weight="bold" fill="#1a1a1a">N24  Celebrity Spokesperson Spot</text>
<rect x="2124" y="1802" width="131" height="38" rx="19" fill="#e3d7ff" stroke="none" data-content="&lt;b&gt;TOF→MOF&lt;/b&gt;" data-text-color="#5a3aa8" data-font-size="18" data-font-family="noto_sans" />
<rect x="2267" y="1802" width="300" height="38" rx="19" fill="#1a1a1a" stroke="none" data-content="&lt;b&gt;NEW · from 7-10 fig brands&lt;/b&gt;" data-text-color="#ffffff" data-font-size="18" data-font-family="noto_sans" />
<rect x="2579" y="1802" width="290" height="38" rx="19" fill="#ffffff" stroke="#e7e7e7" data-content="&lt;b&gt;5 winning ads · 4 brands&lt;/b&gt;" data-text-color="#595959" data-font-size="18" data-font-family="noto_sans" />
<textArea x="2124" y="1858" width="1900" height="329" font-family="noto_sans" font-size="21" fill="#595959">&lt;p&gt;&lt;b&gt;What it is:&lt;/b&gt; A real famous person fronts the ad as the brand&amp;#x27;s spokesperson: opens on the celebrity&amp;#x27;s face/name delivering the hook to camera (selfie-style or studio), intercuts product close-ups and demo b-roll with kinetic claim supers while they keep talking, and closes back on them with a sign-off + logo/shop card.&lt;/p&gt;&lt;p&gt;&lt;b&gt;Why it works:&lt;/b&gt; The face stops the scroll and transfers trust/status instantly; works when a recognizable person (even a niche micro-celebrity or known pro) can credibly endorse the product.&lt;/p&gt;&lt;p&gt;&lt;b&gt;How to make one:&lt;/b&gt; 1) Book the most recognizable face your niche respects (micro-celebrity, known athlete/chef/creator) and have them open with their name or a personal hook. 2) Intercut their lines with 4-6 hero product/demo shots, each with one bold claim super. 3) Close on them saying a one-line endorsement, then logo + offer card.&lt;/p&gt;&lt;p&gt;&lt;b&gt;Closest format already on the board:&lt;/b&gt; Celebrity Podcast Clip (Borrowed Authority): that borrows a real podcast clip; here the celebrity is hired and speaks directly as the brand&amp;#x27;s paid presenter.&lt;/p&gt;</textArea>
