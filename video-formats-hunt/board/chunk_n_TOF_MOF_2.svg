<text x="2124" y="3159" font-family="noto_sans" font-size="38" font-weight="bold" fill="#1a1a1a">N26  Editorial Lookbook (Model Shoot Reel)</text>
<rect x="2124" y="3181" width="131" height="38" rx="19" fill="#e3d7ff" stroke="none" data-content="&lt;b&gt;TOF→MOF&lt;/b&gt;" data-text-color="#5a3aa8" data-font-size="18" data-font-family="noto_sans" />
<rect x="2267" y="3181" width="300" height="38" rx="19" fill="#1a1a1a" stroke="none" data-content="&lt;b&gt;NEW · from 7-10 fig brands&lt;/b&gt;" data-text-color="#ffffff" data-font-size="18" data-font-family="noto_sans" />
<rect x="2579" y="3181" width="290" height="38" rx="19" fill="#ffffff" stroke="#e7e7e7" data-content="&lt;b&gt;5 winning ads · 5 brands&lt;/b&gt;" data-text-color="#595959" data-font-size="18" data-font-family="noto_sans" />
<textArea x="2124" y="3237" width="1900" height="359" font-family="noto_sans" font-size="21" fill="#595959">&lt;p&gt;&lt;b&gt;What it is:&lt;/b&gt; A music-only, campaign-quality model shoot of the product: opens on a wide hero shot of the model in a styled location or studio, cuts between turns, back views and macro fabric/detail close-ups (often several looks or colourways), and closes on a logo or offer end card. No talking, no story, no claims.&lt;/p&gt;&lt;p&gt;&lt;b&gt;Why it works:&lt;/b&gt; For fashion, swim and jewellery the garment is the pitch: a polished shoot makes the piece look premium and aspirational in 6-20s, and it scales cheaply into one ad per SKU or drop.&lt;/p&gt;&lt;p&gt;&lt;b&gt;How to make one:&lt;/b&gt; 1) Book one model and one strong location or seamless backdrop; shoot each piece wide, walking, turning, back view and 3-4 macro detail shots. 2) Cut fast to a trending or moody track (1 shot per ~1s), alternating full-body hero with fabric/detail close-ups; optionally add &amp;#x27;Introducing X&amp;#x27; / &amp;#x27;New in&amp;#x27; super. 3) End on a clean logo/offer card (e.g. &amp;#x27;10% off everything&amp;#x27;, &amp;#x27;Shop the edit&amp;#x27;).&lt;/p&gt;&lt;p&gt;&lt;b&gt;Closest format already on the board:&lt;/b&gt; Try-On Haul - a haul is a creator trying on pieces on her phone and reacting; this is a brand&amp;#x27;s polished, silent editorial shoot of the product with no creator persona.&lt;/p&gt;</textArea>
