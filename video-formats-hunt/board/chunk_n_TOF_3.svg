<text x="2124" y="4416" font-family="noto_sans" font-size="38" font-weight="bold" fill="#1a1a1a">N8  POV Comedy Skit (Creator Plays the Roles)</text>
<rect x="2124" y="4438" width="79" height="38" rx="19" fill="#c6dcff" stroke="none" data-content="&lt;b&gt;TOF&lt;/b&gt;" data-text-color="#305bab" data-font-size="18" data-font-family="noto_sans" />
<rect x="2215" y="4438" width="300" height="38" rx="19" fill="#1a1a1a" stroke="none" data-content="&lt;b&gt;NEW · from 7-10 fig brands&lt;/b&gt;" data-text-color="#ffffff" data-font-size="18" data-font-family="noto_sans" />
<rect x="2527" y="4438" width="290" height="38" rx="19" fill="#ffffff" stroke="#e7e7e7" data-content="&lt;b&gt;5 winning ads · 5 brands&lt;/b&gt;" data-text-color="#595959" data-font-size="18" data-font-family="noto_sans" />
<textArea x="2124" y="4494" width="1900" height="268" font-family="noto_sans" font-size="21" fill="#595959">&lt;p&gt;&lt;b&gt;What it is:&lt;/b&gt; One creator acts out a relatable &amp;#x27;POV:&amp;#x27; situation as characters (often playing both sides with outfit swaps): open on the POV caption, middle is quick comic scenes or back-and-forth dialogue where the problem plays out, close with the product as the in-story fix or punchline.&lt;/p&gt;&lt;p&gt;&lt;b&gt;Why it works:&lt;/b&gt; Reads as native TikTok comedy, not an ad, so cold viewers watch to the end and the product lands as the joke&amp;#x27;s payoff.&lt;/p&gt;&lt;p&gt;&lt;b&gt;How to make one:&lt;/b&gt; 1) Write a &amp;#x27;POV: you...&amp;#x27; line around the exact pain your product fixes. 2) Film 4-8 short scenes on a phone; swap a shirt/prop to play the &amp;#x27;problem&amp;#x27; person and the &amp;#x27;fixer&amp;#x27;. 3) Put the product in as the punchline in the last third, then a one-line CTA.&lt;/p&gt;&lt;p&gt;&lt;b&gt;Closest format already on the board:&lt;/b&gt; Scenarios - that opens on &amp;#x27;imagine if&amp;#x27; and narrates; here the creator performs the scene as characters, skit-style.&lt;/p&gt;</textArea>
