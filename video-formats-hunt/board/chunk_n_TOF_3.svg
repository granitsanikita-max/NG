<text x="96" y="4416" font-family="noto_sans" font-size="38" font-weight="bold" fill="#1a1a1a">N7  Meme Caption Loop (Relatable Joke Clip)</text>
<rect x="96" y="4438" width="79" height="38" rx="19" fill="#c6dcff" stroke="none" data-content="&lt;b&gt;TOF&lt;/b&gt;" data-text-color="#305bab" data-font-size="18" data-font-family="noto_sans" />
<rect x="187" y="4438" width="300" height="38" rx="19" fill="#1a1a1a" stroke="none" data-content="&lt;b&gt;NEW · from 7-10 fig brands&lt;/b&gt;" data-text-color="#ffffff" data-font-size="18" data-font-family="noto_sans" />
<rect x="499" y="4438" width="290" height="38" rx="19" fill="#ffffff" stroke="#e7e7e7" data-content="&lt;b&gt;5 winning ads · 5 brands&lt;/b&gt;" data-text-color="#595959" data-font-size="18" data-font-family="noto_sans" />
<textArea x="96" y="4494" width="1900" height="329" font-family="noto_sans" font-size="21" fill="#595959">&lt;p&gt;&lt;b&gt;What it is:&lt;/b&gt; A 4-10s single-shot (or quick-montage) clip with one relatable meme-format caption (&amp;#x27;Me cancelling my $900 dental surgery after...&amp;#x27;, &amp;#x27;When you know who the killer is but can&amp;#x27;t prove it yet&amp;#x27;, &amp;#x27;Forever girl who needs something in her arms to fall asleep&amp;#x27;), no voiceover, product visible in frame; it ends when the loop ends.&lt;/p&gt;&lt;p&gt;&lt;b&gt;Why it works:&lt;/b&gt; Reads as a meme post rather than an ad, so it gets shared and watched to the end; same build as Video Static, only the caption is a relatable joke instead of a product headline.&lt;/p&gt;&lt;p&gt;&lt;b&gt;How to make one:&lt;/b&gt; 1) Film or source a 5-8s clip of someone (or a pet) using the product in a funny or relatable moment. 2) Write one &amp;#x27;Me when...&amp;#x27; / &amp;#x27;When you...&amp;#x27; caption that ties the joke to the product&amp;#x27;s benefit. 3) Burn it on in native TikTok/IG text style, no VO, and test several captions on the same clip.&lt;/p&gt;&lt;p&gt;&lt;b&gt;Closest format already on the board:&lt;/b&gt; Reaction / Trend-Hijack (Borrowed Fame) - that borrows an existing viral clip or trend; here it is the brand&amp;#x27;s own simple clip with a meme caption. Structurally identical to Video Static, so merged as its meme-caption variant.&lt;/p&gt;</textArea>
