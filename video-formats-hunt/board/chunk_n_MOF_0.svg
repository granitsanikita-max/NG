<text x="64" y="131" font-family="noto_sans" font-size="67" font-weight="bold" fill="#1a1a1a">NEW · Middle of Funnel</text>
<text x="64" y="191" font-family="noto_sans" font-size="32" fill="#595959">Warm audiences. Show the product, build desire and trust.  (10 new formats)</text>
<rect x="64" y="300" width="1964" height="1254" rx="16" fill="#f7f7f7" stroke="none" />
<text x="96" y="370" font-family="noto_sans" font-size="38" font-weight="bold" fill="#1a1a1a">N38  Behind the Build (Factory / Process Tour)</text>
<rect x="96" y="392" width="79" height="38" rx="19" fill="#fff6b6" stroke="none" data-content="&lt;b&gt;MOF&lt;/b&gt;" data-text-color="#8a6300" data-font-size="18" data-font-family="noto_sans" />
<rect x="187" y="392" width="300" height="38" rx="19" fill="#1a1a1a" stroke="none" data-content="&lt;b&gt;NEW · from 7-10 fig brands&lt;/b&gt;" data-text-color="#ffffff" data-font-size="18" data-font-family="noto_sans" />
<rect x="499" y="392" width="290" height="38" rx="19" fill="#ffffff" stroke="#e7e7e7" data-content="&lt;b&gt;5 winning ads · 5 brands&lt;/b&gt;" data-text-color="#595959" data-font-size="18" data-font-family="noto_sans" />
<textArea x="96" y="448" width="1900" height="298" font-family="noto_sans" font-size="21" fill="#595959">&lt;p&gt;&lt;b&gt;What it is:&lt;/b&gt; A brand insider or a step-by-step sequence takes the viewer through where/how the product is made: opens on the finished product or the person on the factory/workshop floor, walks through materials, build and quality checks (often as numbered steps), and closes on the finished product in use or the reveal + brand card.&lt;/p&gt;&lt;p&gt;&lt;b&gt;Why it works:&lt;/b&gt; Shows the craftsmanship and quality control behind the price, answering &amp;#x27;is it cheap junk / is it safe&amp;#x27; objections with visible proof.&lt;/p&gt;&lt;p&gt;&lt;b&gt;How to make one:&lt;/b&gt; 1) Get supplier/factory or workshop footage (ask your supplier for production-line clips) or film a rep in the warehouse. 2) Structure it as 3-4 steps: raw material &amp;gt; build &amp;gt; QC/packing, with one caption or line per step. 3) End on the finished product reveal or in use + offer.&lt;/p&gt;&lt;p&gt;&lt;b&gt;Closest format already on the board:&lt;/b&gt; Pack An Order With Me (Fulfilment POV) - that shows packing a customer order; this shows manufacturing/quality of the product itself. Also unlike Founder Story, it is about the process, not the person&amp;#x27;s journey.&lt;/p&gt;</textArea>
<rect x="96" y="770" width="360" height="640" rx="8" fill="#1a1a1a" stroke="none" />
