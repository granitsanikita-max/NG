<rect x="2527" y="5787" width="290" height="38" rx="19" fill="#ffffff" stroke="#e7e7e7" data-content="&lt;b&gt;5 winning ads · 4 brands&lt;/b&gt;" data-text-color="#595959" data-font-size="18" data-font-family="noto_sans" />
<textArea x="2124" y="5843" width="1900" height="268" font-family="noto_sans" font-size="21" fill="#595959">&lt;p&gt;&lt;b&gt;What it is:&lt;/b&gt; The whole ad is an original catchy song about the product: open on &amp;#x27;Have you heard this song?&amp;#x27;, middle is karaoke-captioned lyrics carrying every benefit over a montage of people using it, close on a lyric that is the CTA.&lt;/p&gt;&lt;p&gt;&lt;b&gt;Why it works:&lt;/b&gt; Melody makes benefits memorable and the lyric captions keep people watching; good for broad lifestyle products.&lt;/p&gt;&lt;p&gt;&lt;b&gt;How to make one:&lt;/b&gt; 1) Write a 20-30s song whose lines are your benefits (AI music tools work). 2) Cut a montage of different people using the product, one shot per line. 3) Add karaoke-style lyric captions with a waveform; end on the brand name line.&lt;/p&gt;&lt;p&gt;&lt;b&gt;Closest format already on the board:&lt;/b&gt; Satisfying B-roll / Product Demo - montage of use, but the original song is the script and the hook.&lt;/p&gt;</textArea>
