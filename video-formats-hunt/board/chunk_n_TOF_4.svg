<rect x="96" y="5787" width="79" height="38" rx="19" fill="#c6dcff" stroke="none" data-content="&lt;b&gt;TOF&lt;/b&gt;" data-text-color="#305bab" data-font-size="18" data-font-family="noto_sans" />
