<text x="2124" y="1749" font-family="noto_sans" font-size="38" font-weight="bold" fill="#1a1a1a">N51  Offer Stack Breakdown (Here&#x27;s Everything You Get)</text>
<rect x="2124" y="1771" width="131" height="38" rx="19" fill="#ffe0c2" stroke="none" data-content="&lt;b&gt;MOF→BOF&lt;/b&gt;" data-text-color="#a14d00" data-font-size="18" data-font-family="noto_sans" />
<rect x="2267" y="1771" width="300" height="38" rx="19" fill="#1a1a1a" stroke="none" data-content="&lt;b&gt;NEW · from 7-10 fig brands&lt;/b&gt;" data-text-color="#ffffff" data-font-size="18" data-font-family="noto_sans" />
<rect x="2579" y="1771" width="290" height="38" rx="19" fill="#ffffff" stroke="#e7e7e7" data-content="&lt;b&gt;5 winning ads · 5 brands&lt;/b&gt;" data-text-color="#595959" data-font-size="18" data-font-family="noto_sans" />
<textArea x="2124" y="1827" width="1900" height="390" font-family="noto_sans" font-size="21" fill="#595959">&lt;p&gt;&lt;b&gt;What it is:&lt;/b&gt; The whole ad is the deal itself: a hook that teases an unbelievable offer (&amp;#x27;someone&amp;#x27;s getting fired&amp;#x27;, &amp;#x27;we need to apologize to anyone who paid full price&amp;#x27;), then the presenter or hands pull out each item one at a time and name it (&amp;#x27;you get X... plus Y for FREE... plus Z&amp;#x27;), stacking value until a price/discount reveal, guarantee and &amp;#x27;before it&amp;#x27;s gone&amp;#x27; close.&lt;/p&gt;&lt;p&gt;&lt;b&gt;Why it works:&lt;/b&gt; Turns a bundle or gift-with-purchase into a visible pile of value so the price feels like a steal; best for warm audiences and sale periods when you have a bundle or free gifts to push.&lt;/p&gt;&lt;p&gt;&lt;b&gt;How to make one:&lt;/b&gt; 1) Build a bundle (main product + 2-4 cheap free add-ons) and open on an offer-shock hook like &amp;#x27;Don&amp;#x27;t buy X until you see this deal&amp;#x27;. 2) Hold up or unpack each item one by one with a caption per item (&amp;#x27;FREE glass bottle&amp;#x27;, &amp;#x27;PLUS a travel bag&amp;#x27;), keeping a running &amp;#x27;and you also get...&amp;#x27; rhythm. 3) Reveal total value vs price (or % off / per-unit price), add the guarantee, and close with urgency (&amp;#x27;grab it before it&amp;#x27;s gone&amp;#x27;).&lt;/p&gt;&lt;p&gt;&lt;b&gt;Closest format already on the board:&lt;/b&gt; Unboxing (First-Open Reveal) - unboxing is about the first-impression reveal of one product; here every beat is a priced offer item and the ad is built around the deal math, not the product experience.&lt;/p&gt;</textArea>
