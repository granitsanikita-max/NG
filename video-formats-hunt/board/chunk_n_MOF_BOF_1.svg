<rect x="551" y="1771" width="290" height="38" rx="19" fill="#ffffff" stroke="#e7e7e7" data-content="&lt;b&gt;5 winning ads · 4 brands&lt;/b&gt;" data-text-color="#595959" data-font-size="18" data-font-family="noto_sans" />
<textArea x="96" y="1827" width="1900" height="298" font-family="noto_sans" font-size="21" fill="#595959">&lt;p&gt;&lt;b&gt;What it is:&lt;/b&gt; An ultra-short 2-6s looping spot: one fixed headline or offer line sits on screen the whole time (&amp;#x27;An icon of play. Rarely in stock.&amp;#x27;, &amp;#x27;the dreamiest sleepsuits for just £20&amp;#x27;) over 1-4 rapid product-in-use shots, then a logo flash; no VO, no story.&lt;/p&gt;&lt;p&gt;&lt;b&gt;Why it works:&lt;/b&gt; Costs almost nothing, loops for repeat views and hammers one message cheaply; ideal for frequency/retargeting and for testing headlines and offers fast.&lt;/p&gt;&lt;p&gt;&lt;b&gt;How to make one:&lt;/b&gt; 1) Write one 5-8 word headline or price/offer line. 2) Grab 1-4 one-second clips of the product in use (or a hanger-swap of variants) and cut to 2-6s so it loops cleanly. 3) Keep the headline fixed on screen, add a logo flash at the end, run many headline variants.&lt;/p&gt;&lt;p&gt;&lt;b&gt;Closest format already on the board:&lt;/b&gt; Satisfying B-roll (Front-Splice): that is a scroll-stopper spliced before a longer ad; this is the whole ad in under 6s with one fixed headline.&lt;/p&gt;</textArea>
