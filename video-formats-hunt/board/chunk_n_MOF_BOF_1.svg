<rect x="96" y="1771" width="131" height="38" rx="19" fill="#ffe0c2" stroke="none" data-content="&lt;b&gt;MOF→BOF&lt;/b&gt;" data-text-color="#a14d00" data-font-size="18" data-font-family="noto_sans" />
