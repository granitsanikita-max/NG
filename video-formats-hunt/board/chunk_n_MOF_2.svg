<rect x="2092" y="3028" width="1964" height="1285" rx="16" fill="#f7f7f7" stroke="none" />
<text x="2124" y="3098" font-family="noto_sans" font-size="38" font-weight="bold" fill="#1a1a1a">N43  Partner POV (She Buys It For Him)</text>
<rect x="2124" y="3120" width="79" height="38" rx="19" fill="#fff6b6" stroke="none" data-content="&lt;b&gt;MOF&lt;/b&gt;" data-text-color="#8a6300" data-font-size="18" data-font-family="noto_sans" />
<rect x="2215" y="3120" width="300" height="38" rx="19" fill="#1a1a1a" stroke="none" data-content="&lt;b&gt;NEW · from 7-10 fig brands&lt;/b&gt;" data-text-color="#ffffff" data-font-size="18" data-font-family="noto_sans" />
<rect x="2527" y="3120" width="290" height="38" rx="19" fill="#ffffff" stroke="#e7e7e7" data-content="&lt;b&gt;5 winning ads · 5 brands&lt;/b&gt;" data-text-color="#595959" data-font-size="18" data-font-family="noto_sans" />
<textArea x="2124" y="3176" width="1900" height="298" font-family="noto_sans" font-size="21" fill="#595959">&lt;p&gt;&lt;b&gt;What it is:&lt;/b&gt; A wife/girlfriend talks to camera (or narrates) about a men&amp;#x27;s product from her side: open on a line to other women (&amp;#x27;ladies...&amp;#x27;, &amp;#x27;my husband used to...&amp;#x27;), middle shows him using/wearing it as silent proof while she explains why she made him switch, close on the couple and a &amp;#x27;get it for him&amp;#x27; CTA.&lt;/p&gt;&lt;p&gt;&lt;b&gt;Why it works:&lt;/b&gt; Targets the woman who actually buys or gifts men&amp;#x27;s products, and her approval doubles as social proof for the man.&lt;/p&gt;&lt;p&gt;&lt;b&gt;How to make one:&lt;/b&gt; 1) Cast a couple; she leads, he only appears in b-roll wearing/using the product. 2) Script: what she hated about his old version -&amp;gt; why she switched him -&amp;gt; what changed (looks, mood, confidence). 3) End with an affectionate couple shot and &amp;#x27;ladies, get this for your man&amp;#x27;.&lt;/p&gt;&lt;p&gt;&lt;b&gt;Closest format already on the board:&lt;/b&gt; Lesson From Others (Mentor Story) - third-person story too, but here the narrator is the buyer&amp;#x27;s partner and the ad is aimed at women buying for men.&lt;/p&gt;</textArea>
