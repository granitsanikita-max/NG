<text x="96" y="3098" font-family="noto_sans" font-size="38" font-weight="bold" fill="#1a1a1a">N42  Pack My Bag (What&#x27;s In My Bag)</text>
<rect x="96" y="3120" width="79" height="38" rx="19" fill="#fff6b6" stroke="none" data-content="&lt;b&gt;MOF&lt;/b&gt;" data-text-color="#8a6300" data-font-size="18" data-font-family="noto_sans" />
<rect x="187" y="3120" width="300" height="38" rx="19" fill="#1a1a1a" stroke="none" data-content="&lt;b&gt;NEW · from 7-10 fig brands&lt;/b&gt;" data-text-color="#ffffff" data-font-size="18" data-font-family="noto_sans" />
<rect x="499" y="3120" width="290" height="38" rx="19" fill="#ffffff" stroke="#e7e7e7" data-content="&lt;b&gt;5 winning ads · 4 brands&lt;/b&gt;" data-text-color="#595959" data-font-size="18" data-font-family="noto_sans" />
<textArea x="96" y="3176" width="1900" height="329" font-family="noto_sans" font-size="21" fill="#595959">&lt;p&gt;&lt;b&gt;What it is:&lt;/b&gt; Hands (or a faceless torso) pack everyday essentials (phone, wallet, laptop, keys, lipstick, AirPods) into the bag one by one on a table or cafe bench, showing it swallows everything, then lift it onto the shoulder and close on the logo.&lt;/p&gt;&lt;p&gt;&lt;b&gt;Why it works:&lt;/b&gt; Answers the main bag/organiser objection, &amp;#x27;will my stuff fit?&amp;#x27;, visually and in seconds, and the satisfying packing reads as native &amp;#x27;what&amp;#x27;s in my bag&amp;#x27; content.&lt;/p&gt;&lt;p&gt;&lt;b&gt;How to make one:&lt;/b&gt; 1) Lay the bag plus 6-8 recognisable daily essentials neatly around it on a clean surface or a lifestyle spot (cafe, desk). 2) Film overhead or chest height as hands drop items in one at a time, showing pockets/compartments; add one line of copy (&amp;#x27;A work bag designed for more than the office&amp;#x27;). 3) End with the packed bag zipped and lifted onto the shoulder, then logo.&lt;/p&gt;&lt;p&gt;&lt;b&gt;Closest format already on the board:&lt;/b&gt; Product Demo Ads - a general demo shows features in use; this is one fixed beat (packing real daily essentials) that proves capacity and organisation.&lt;/p&gt;</textArea>
<rect x="96" y="3529" width="360" height="640" rx="8" fill="#1a1a1a" stroke="none" />
