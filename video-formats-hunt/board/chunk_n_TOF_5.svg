<text x="2124" y="7083" font-family="noto_sans" font-size="38" font-weight="bold" fill="#1a1a1a">N12  Scripted Comedy Sketch (Produced Skit)</text>
<rect x="2124" y="7105" width="79" height="38" rx="19" fill="#c6dcff" stroke="none" data-content="&lt;b&gt;TOF&lt;/b&gt;" data-text-color="#305bab" data-font-size="18" data-font-family="noto_sans" />
<rect x="2215" y="7105" width="300" height="38" rx="19" fill="#1a1a1a" stroke="none" data-content="&lt;b&gt;NEW · from 7-10 fig brands&lt;/b&gt;" data-text-color="#ffffff" data-font-size="18" data-font-family="noto_sans" />
<rect x="2527" y="7105" width="290" height="38" rx="19" fill="#ffffff" stroke="#e7e7e7" data-content="&lt;b&gt;5 winning ads · 4 brands&lt;/b&gt;" data-text-color="#595959" data-font-size="18" data-font-family="noto_sans" />
<textArea x="2124" y="7161" width="1900" height="268" font-family="noto_sans" font-size="21" fill="#595959">&lt;p&gt;&lt;b&gt;What it is:&lt;/b&gt; A produced, multi-actor comedy scene with a script: open on a relatable or absurd setup (genre parody, office/home chaos, staff skit), middle escalates the gag with the product woven into the plot, close on the product as the punchline plus a benefit/offer card.&lt;/p&gt;&lt;p&gt;&lt;b&gt;Why it works:&lt;/b&gt; Entertainment buys attention and brand memory; works for broad products where the problem can be exaggerated into a joke.&lt;/p&gt;&lt;p&gt;&lt;b&gt;How to make one:&lt;/b&gt; 1) Pick one exaggerated problem moment or a genre to parody (zombie film, sitcom, therapy). 2) Shoot a 15-60s skit with 2+ actors and a clear setup -&amp;gt; escalation -&amp;gt; product punchline. 3) Close on a pack shot with one benefit line and the offer.&lt;/p&gt;&lt;p&gt;&lt;b&gt;Closest format already on the board:&lt;/b&gt; Problem-Agitate-Solve - same problem-&amp;gt;fix arc, but delivered as an acted comedy sketch with characters, not a pitch.&lt;/p&gt;</textArea>
