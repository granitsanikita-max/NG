<rect x="499" y="7105" width="290" height="38" rx="19" fill="#ffffff" stroke="#e7e7e7" data-content="&lt;b&gt;5 winning ads · 5 brands&lt;/b&gt;" data-text-color="#595959" data-font-size="18" data-font-family="noto_sans" />
<textArea x="96" y="7161" width="1900" height="359" font-family="noto_sans" font-size="21" fill="#595959">&lt;p&gt;&lt;b&gt;What it is:&lt;/b&gt; A food-creator style recipe video: opens on the finished, craveable dish/drink (or a &amp;#x27;best drink I ever made&amp;#x27; hook), then shows the recipe built step by step with the product added as one ingredient (pack shot mid-way), and closes on the money shot / first bite.&lt;/p&gt;&lt;p&gt;&lt;b&gt;Why it works:&lt;/b&gt; It looks like native recipe content people save and share, so the product gets screen time inside something useful instead of a pitch; ideal for consumables (powders, oils, drink mixes, sauces, supplements).&lt;/p&gt;&lt;p&gt;&lt;b&gt;How to make one:&lt;/b&gt; 1) Pick a craveable, trending recipe (mocktail, s&amp;#x27;mores bars, protein bites) where your product is a natural ingredient. 2) Open on the finished result, then shoot hands/creator assembling it step by step with a clear branded pack shot as the product goes in. 3) End on the bite/sip reaction or hero shot with recipe card text and a soft CTA.&lt;/p&gt;&lt;p&gt;&lt;b&gt;Closest format already on the board:&lt;/b&gt; UGC How-To / Product Demo - those show how to use the product itself; here the ad is a recipe and the product is just one ingredient in a bigger dish.&lt;/p&gt;</textArea>
