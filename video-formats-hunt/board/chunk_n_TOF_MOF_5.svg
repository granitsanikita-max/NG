<text x="2124" y="7266" font-family="noto_sans" font-size="38" font-weight="bold" fill="#1a1a1a">N32  Torture Test (Try To Break It)</text>
<rect x="2124" y="7288" width="131" height="38" rx="19" fill="#e3d7ff" stroke="none" data-content="&lt;b&gt;TOF→MOF&lt;/b&gt;" data-text-color="#5a3aa8" data-font-size="18" data-font-family="noto_sans" />
<rect x="2267" y="7288" width="300" height="38" rx="19" fill="#1a1a1a" stroke="none" data-content="&lt;b&gt;NEW · from 7-10 fig brands&lt;/b&gt;" data-text-color="#ffffff" data-font-size="18" data-font-family="noto_sans" />
<rect x="2579" y="7288" width="290" height="38" rx="19" fill="#ffffff" stroke="#e7e7e7" data-content="&lt;b&gt;5 winning ads · 5 brands&lt;/b&gt;" data-text-color="#595959" data-font-size="18" data-font-family="noto_sans" />
<textArea x="2124" y="7344" width="1900" height="268" font-family="noto_sans" font-size="21" fill="#595959">&lt;p&gt;&lt;b&gt;What it is:&lt;/b&gt; The whole ad is a sequence of escalating abuse or stress attempts on the product (flips, jumps, drops, water, weight) with it surviving each one, ending on the verdict shot (&amp;#x27;still in / still works&amp;#x27;) and brand.&lt;/p&gt;&lt;p&gt;&lt;b&gt;Why it works:&lt;/b&gt; Visual proof of durability or fit beats any claim and the escalation keeps people watching to see if it finally fails.&lt;/p&gt;&lt;p&gt;&lt;b&gt;How to make one:&lt;/b&gt; 1) List 5-7 increasingly extreme tests relevant to your product&amp;#x27;s promise (falls out? breaks? leaks?). 2) Film each in one clean shot with a short caption, hardest test last. 3) End on the intact product + a &amp;#x27;still going&amp;#x27; verdict and offer.&lt;/p&gt;&lt;p&gt;&lt;b&gt;Closest format already on the board:&lt;/b&gt; Product Demo Ads / Challenge - a demo shows normal use; this is a pure escalating stress test where survival is the payoff.&lt;/p&gt;</textArea>
