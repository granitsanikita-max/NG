<text x="96" y="7266" font-family="noto_sans" font-size="38" font-weight="bold" fill="#1a1a1a">N31  Quiz Walkthrough</text>
<rect x="96" y="7288" width="131" height="38" rx="19" fill="#e3d7ff" stroke="none" data-content="&lt;b&gt;TOF→MOF&lt;/b&gt;" data-text-color="#5a3aa8" data-font-size="18" data-font-family="noto_sans" />
<rect x="239" y="7288" width="300" height="38" rx="19" fill="#1a1a1a" stroke="none" data-content="&lt;b&gt;NEW · from 7-10 fig brands&lt;/b&gt;" data-text-color="#ffffff" data-font-size="18" data-font-family="noto_sans" />
<rect x="551" y="7288" width="290" height="38" rx="19" fill="#ffffff" stroke="#e7e7e7" data-content="&lt;b&gt;5 winning ads · 4 brands&lt;/b&gt;" data-text-color="#595959" data-font-size="18" data-font-family="noto_sans" />
<textArea x="96" y="7344" width="1900" height="268" font-family="noto_sans" font-size="21" fill="#595959">&lt;p&gt;&lt;b&gt;What it is:&lt;/b&gt; A relatable person states a problem and the confusion (&amp;#x27;hundreds of products... which one do I even need?&amp;#x27;), says an expert built a short quiz, then a screen recording walks through the quiz questions and the &amp;#x27;calculating your results&amp;#x27; screen, closing on &amp;#x27;take the free 2-minute quiz, link below&amp;#x27;.&lt;/p&gt;&lt;p&gt;&lt;b&gt;Why it works:&lt;/b&gt; Sells a free personalised answer instead of a product, lowering friction for cold traffic and segmenting buyers into the right SKU.&lt;/p&gt;&lt;p&gt;&lt;b&gt;How to make one:&lt;/b&gt; 1) Build a 4-6 question quiz that routes to your product/bundle (Typeform, Octane AI, Shopify quiz app). 2) Film a person with the problem + &amp;#x27;which one do I need?&amp;#x27; confusion, then screen-record answering the quiz. 3) End on the results-loading screen and a &amp;#x27;take the free quiz&amp;#x27; CTA.&lt;/p&gt;&lt;p&gt;&lt;b&gt;Closest format already on the board:&lt;/b&gt; Q&amp;amp;A - there the creator answers a question; here the call-to-action is the quiz itself and the ad demos taking it.&lt;/p&gt;</textArea>
<rect x="96" y="7636" width="360" height="640" rx="8" fill="#1a1a1a" stroke="none" />
<textArea x="96" y="8284" width="360" height="104" font-family="noto_sans" font-size="16" fill="#1a1a1a">&lt;p&gt;&lt;b&gt;1  Beyond Alpha&lt;/b&gt;&lt;/p&gt;&lt;p&gt;Meta ad · 145 days live&lt;/p&gt;&lt;p&gt;&lt;a href="https://www.facebook.com/ads/library/?id=4449695255357283"&gt;▶ Ad Library&lt;/a&gt;  ·  &lt;a href="https://app.winninghunter.com/ad/4449695255357283?platform=meta"&gt;WH&lt;/a&gt;  ·  &lt;a href="https://drive.google.com/file/d/17i973qxIuH1uV0xHTFVHl-WK9uJPE4KF/view"&gt;💾 Saved copy&lt;/a&gt;&lt;/p&gt;</textArea>
