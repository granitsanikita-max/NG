<text x="2124" y="8554" font-family="noto_sans" font-size="38" font-weight="bold" fill="#1a1a1a">N34  This or That (Pick Your Vibe)</text>
<rect x="2124" y="8576" width="131" height="38" rx="19" fill="#e3d7ff" stroke="none" data-content="&lt;b&gt;TOF→MOF&lt;/b&gt;" data-text-color="#5a3aa8" data-font-size="18" data-font-family="noto_sans" />
<rect x="2267" y="8576" width="300" height="38" rx="19" fill="#1a1a1a" stroke="none" data-content="&lt;b&gt;NEW · from 7-10 fig brands&lt;/b&gt;" data-text-color="#ffffff" data-font-size="18" data-font-family="noto_sans" />
<rect x="2579" y="8576" width="290" height="38" rx="19" fill="#ffffff" stroke="#e7e7e7" data-content="&lt;b&gt;4 winning ads · 3 brands&lt;/b&gt;" data-text-color="#595959" data-font-size="18" data-font-family="noto_sans" />
<textArea x="2124" y="8632" width="1900" height="359" font-family="noto_sans" font-size="21" fill="#595959">&lt;p&gt;&lt;b&gt;What it is:&lt;/b&gt; Two product variants shown side by side under a fixed header (&amp;#x27;Choose your spooky season vibe&amp;#x27;, &amp;#x27;Same but different&amp;#x27;), each labelled by name, swapping to a new pair every 1-2s for 6-8 rounds so the viewer silently picks, then ending on a full collection grid + shop CTA.&lt;/p&gt;&lt;p&gt;&lt;b&gt;Why it works:&lt;/b&gt; Turns browsing into a game: every pair is a micro-decision that keeps the viewer watching, shows the whole range fast, and makes them mentally pick a favourite before the CTA; ideal for products with many SKUs.&lt;/p&gt;&lt;p&gt;&lt;b&gt;How to make one:&lt;/b&gt; 1) Pick 12-16 variants (colours, shapes, scents) and pair them; film each pair side by side in the same framing (e.g. two fingers, two hands, two items). 2) Add a fixed &amp;#x27;Choose your ___ vibe&amp;#x27; header and name labels; cut a new pair every ~1.5s. 3) Close on a grid of the whole collection with &amp;#x27;Shop the collection&amp;#x27; / offer badge, and ask &amp;#x27;which one are you?&amp;#x27; in copy.&lt;/p&gt;&lt;p&gt;&lt;b&gt;Closest format already on the board:&lt;/b&gt; Ranking / Tier List - a tier list ranks options with your product on top; this lets the viewer pick between your own variants with no ranking or competitor.&lt;/p&gt;</textArea>
