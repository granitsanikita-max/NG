<text x="64" y="191" font-family="noto_sans" font-size="32" fill="#595959">Warm-to-hot. Product + offer, push to buy.  (6 new formats)</text>
<rect x="64" y="300" width="1964" height="1315" rx="16" fill="#f7f7f7" stroke="none" />
<text x="96" y="370" font-family="noto_sans" font-size="38" font-weight="bold" fill="#1a1a1a">N48  Animated Static (Motion-Graphic Packshot)</text>
<rect x="96" y="392" width="131" height="38" rx="19" fill="#ffe0c2" stroke="none" data-content="&lt;b&gt;MOF→BOF&lt;/b&gt;" data-text-color="#a14d00" data-font-size="18" data-font-family="noto_sans" />
<rect x="239" y="392" width="300" height="38" rx="19" fill="#1a1a1a" stroke="none" data-content="&lt;b&gt;NEW · from 7-10 fig brands&lt;/b&gt;" data-text-color="#ffffff" data-font-size="18" data-font-family="noto_sans" />
<rect x="551" y="392" width="290" height="38" rx="19" fill="#ffffff" stroke="#e7e7e7" data-content="&lt;b&gt;5 winning ads · 5 brands&lt;/b&gt;" data-text-color="#595959" data-font-size="18" data-font-family="noto_sans" />
<textArea x="96" y="448" width="1900" height="359" font-family="noto_sans" font-size="21" fill="#595959">&lt;p&gt;&lt;b&gt;What it is:&lt;/b&gt; A 5-15s ad that is basically a static image ad brought to life: one product packshot (or offer card) on a designed background, a bold headline, then benefit callouts, a stat, a price/offer badge or a countdown animate in one by one, ending on the packshot + CTA. No people talking, no footage story.&lt;/p&gt;&lt;p&gt;&lt;b&gt;Why it works:&lt;/b&gt; Cheapest video asset to make and test: it gets static-ad clarity (product + promise + offer in one glance) into Reels/Stories placements, and the motion buys the extra second of attention a flat static loses.&lt;/p&gt;&lt;p&gt;&lt;b&gt;How to make one:&lt;/b&gt; 1) Take a clean packshot (or render) of the product on a brand-colour or moody background and write one punchy headline. 2) Animate in 3-4 elements in sequence: benefit tags/leader-line callouts, one stat (&amp;#x27;91% saw results&amp;#x27;), then the offer badge or a ticking timer. 3) Hold on the full card for 2-3s with the CTA; export 9:16 and 4:5, swap only headline/offer for variants.&lt;/p&gt;&lt;p&gt;&lt;b&gt;Closest format already on the board:&lt;/b&gt; Text-Wall Story (Read-Along Still): both are &amp;#x27;one still&amp;#x27;, but that is a long first-person story to read; this is a product packshot with short callouts/offer animating in.&lt;/p&gt;</textArea>
