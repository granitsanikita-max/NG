<rect x="2092" y="300" width="1964" height="1315" rx="16" fill="#f7f7f7" stroke="none" />
<text x="2124" y="370" font-family="noto_sans" font-size="38" font-weight="bold" fill="#1a1a1a">N49  Flipbook Slideshow (Fixed Frame, Cards Flip)</text>
<rect x="2124" y="392" width="131" height="38" rx="19" fill="#ffe0c2" stroke="none" data-content="&lt;b&gt;MOF→BOF&lt;/b&gt;" data-text-color="#a14d00" data-font-size="18" data-font-family="noto_sans" />
<rect x="2267" y="392" width="300" height="38" rx="19" fill="#1a1a1a" stroke="none" data-content="&lt;b&gt;NEW · from 7-10 fig brands&lt;/b&gt;" data-text-color="#ffffff" data-font-size="18" data-font-family="noto_sans" />
<rect x="2579" y="392" width="290" height="38" rx="19" fill="#ffffff" stroke="#e7e7e7" data-content="&lt;b&gt;5 winning ads · 5 brands&lt;/b&gt;" data-text-color="#595959" data-font-size="18" data-font-family="noto_sans" />
<textArea x="2124" y="448" width="1900" height="359" font-family="noto_sans" font-size="21" fill="#595959">&lt;p&gt;&lt;b&gt;What it is:&lt;/b&gt; A 6-15s motion graphic where the frame stays locked (brand header, sale line or &amp;#x27;live now&amp;#x27; label) while the image in the middle flips every ~0.5-1.5s through many cards: each product/SKU/colourway as a cutout or model+flat-lay card, or the brand&amp;#x27;s own past sale creatives. It ends on the last card or a shop-now card.&lt;/p&gt;&lt;p&gt;&lt;b&gt;Why it works:&lt;/b&gt; Shows the whole range or offer history in one scroll-stopping rhythm; the fixed headline carries the message (new drop, sale, &amp;#x27;we won&amp;#x27;t do this again&amp;#x27;) while the flipping cards keep eyes on it. Ideal for multi-SKU stores and sales.&lt;/p&gt;&lt;p&gt;&lt;b&gt;How to make one:&lt;/b&gt; 1) Lock a template: brand name + one line (&amp;#x27;Live now&amp;#x27;, &amp;#x27;Up to 40% off&amp;#x27;, &amp;#x27;We won&amp;#x27;t do this again&amp;#x27;) and a clean white or brand-colour background. 2) Drop in 6-12 product cutouts / colourways (or screenshots of your past sale statics), one per card, each with its name or price. 3) Flip a card every 0.5-1.5s to a beat, add a ticker/countdown if it&amp;#x27;s a sale, end on a shop-now card; export 9:16.&lt;/p&gt;&lt;p&gt;&lt;b&gt;Closest format already on the board:&lt;/b&gt; Try-On Haul / Collection Lookbook show range with live footage of a person; this is a pure graphic template where only the card in a fixed frame changes.&lt;/p&gt;</textArea>
