<text x="96" y="1749" font-family="noto_sans" font-size="38" font-weight="bold" fill="#1a1a1a">N3  Brand Anthem Montage (Manifesto)</text>
<rect x="96" y="1771" width="79" height="38" rx="19" fill="#c6dcff" stroke="none" data-content="&lt;b&gt;TOF&lt;/b&gt;" data-text-color="#305bab" data-font-size="18" data-font-family="noto_sans" />
<rect x="187" y="1771" width="300" height="38" rx="19" fill="#1a1a1a" stroke="none" data-content="&lt;b&gt;NEW · from 7-10 fig brands&lt;/b&gt;" data-text-color="#ffffff" data-font-size="18" data-font-family="noto_sans" />
<rect x="499" y="1771" width="290" height="38" rx="19" fill="#ffffff" stroke="#e7e7e7" data-content="&lt;b&gt;5 winning ads · 4 brands&lt;/b&gt;" data-text-color="#595959" data-font-size="18" data-font-family="noto_sans" />
<textArea x="96" y="1827" width="1900" height="329" font-family="noto_sans" font-size="21" fill="#595959">&lt;p&gt;&lt;b&gt;What it is:&lt;/b&gt; A cinematic manifesto: opens on a bold logo or one-word line, then a fast montage of many aspirational people/moments (or one protagonist in vignettes) runs under a single VO or word-by-word super that states what the brand believes, and closes on logo + tagline.&lt;/p&gt;&lt;p&gt;&lt;b&gt;Why it works:&lt;/b&gt; Turns a commodity into an identity (&amp;#x27;people like us use this&amp;#x27;), building brand recall and a tribe; best for cold reach and to give the brand a point of view.&lt;/p&gt;&lt;p&gt;&lt;b&gt;How to make one:&lt;/b&gt; 1) Write a 4-8 line belief statement about the buyer&amp;#x27;s identity, not the product (e.g. &amp;#x27;Your body needs it to perform, to recover, to embrace the moments&amp;#x27;). 2) Cut 10-15 short, high-energy lifestyle/athlete clips (stock or shot), one line of the manifesto per clip as a centered super or VO. 3) Show the product only in 1-2 beats, end on logo + tagline.&lt;/p&gt;&lt;p&gt;&lt;b&gt;Closest format already on the board:&lt;/b&gt; Goal / Dream Journey or Personal Story: those follow one real person&amp;#x27;s arc; this is a belief statement read over a montage of many people.&lt;/p&gt;</textArea>
<rect x="96" y="2180" width="360" height="640" rx="8" fill="#1a1a1a" stroke="none" />
