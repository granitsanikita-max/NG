<rect x="2092" y="1679" width="1964" height="1285" rx="16" fill="#f7f7f7" stroke="none" />
<text x="2124" y="1749" font-family="noto_sans" font-size="38" font-weight="bold" fill="#1a1a1a">N4  Campaign Shoot Vlog (On Set BTS)</text>
<rect x="2124" y="1771" width="79" height="38" rx="19" fill="#c6dcff" stroke="none" data-content="&lt;b&gt;TOF&lt;/b&gt;" data-text-color="#305bab" data-font-size="18" data-font-family="noto_sans" />
<rect x="2215" y="1771" width="300" height="38" rx="19" fill="#1a1a1a" stroke="none" data-content="&lt;b&gt;NEW · from 7-10 fig brands&lt;/b&gt;" data-text-color="#ffffff" data-font-size="18" data-font-family="noto_sans" />
<rect x="2527" y="1771" width="290" height="38" rx="19" fill="#ffffff" stroke="#e7e7e7" data-content="&lt;b&gt;5 winning ads · 5 brands&lt;/b&gt;" data-text-color="#595959" data-font-size="18" data-font-family="noto_sans" />
<textArea x="2124" y="1827" width="1900" height="298" font-family="noto_sans" font-size="21" fill="#595959">&lt;p&gt;&lt;b&gt;What it is:&lt;/b&gt; Lo-fi phone vlog from the brand&amp;#x27;s own campaign/photo shoot: opens &amp;#x27;we&amp;#x27;re on set for our ... shoot&amp;#x27;, then handheld clips of models/founder changing, crew, lights, mood boards and between-take moments showing the new collection, closing on a final look or group shot.&lt;/p&gt;&lt;p&gt;&lt;b&gt;Why it works:&lt;/b&gt; Shows a new collection on real bodies in an exciting insider context, so it reads as native content rather than a polished catalogue ad.&lt;/p&gt;&lt;p&gt;&lt;b&gt;How to make one:&lt;/b&gt; 1) During any product photoshoot, have someone film vertical handheld BTS: setup, outfit changes, models laughing, shot review. 2) Add casual narrator captions (&amp;#x27;we&amp;#x27;re on set for...&amp;#x27;, &amp;#x27;she wants to frame this one&amp;#x27;). 3) Cut 30-60s, end on the best final look or a lineup of the pieces.&lt;/p&gt;&lt;p&gt;&lt;b&gt;Closest format already on the board:&lt;/b&gt; Day In The Life / Try-On Haul - here the setting is the brand&amp;#x27;s own shoot and the collection is revealed through on-set BTS, not a creator&amp;#x27;s day or a solo try-on.&lt;/p&gt;</textArea>
