<rect x="2092" y="9771" width="1964" height="1346" rx="16" fill="#f7f7f7" stroke="none" />
<text x="2124" y="9841" font-family="noto_sans" font-size="38" font-weight="bold" fill="#1a1a1a">N16  Meme Montage (Chaos Edit)</text>
<rect x="2124" y="9863" width="79" height="38" rx="19" fill="#c6dcff" stroke="none" data-content="&lt;b&gt;TOF&lt;/b&gt;" data-text-color="#305bab" data-font-size="18" data-font-family="noto_sans" />
<rect x="2215" y="9863" width="300" height="38" rx="19" fill="#1a1a1a" stroke="none" data-content="&lt;b&gt;NEW · from 7-10 fig brands&lt;/b&gt;" data-text-color="#ffffff" data-font-size="18" data-font-family="noto_sans" />
<rect x="2527" y="9863" width="290" height="38" rx="19" fill="#ffffff" stroke="#e7e7e7" data-content="&lt;b&gt;4 winning ads · 4 brands&lt;/b&gt;" data-text-color="#595959" data-font-size="18" data-font-family="noto_sans" />
<textArea x="2124" y="9919" width="1900" height="390" font-family="noto_sans" font-size="21" fill="#595959">&lt;p&gt;&lt;b&gt;What it is:&lt;/b&gt; A voiceover (or punchy one-word captions) carries the pitch while the picture cuts every 1-2s to a different borrowed or absurd clip - archival B&amp;amp;W film, movie/anime moments, stunts, stock disasters, glitch zooms, cut-out meme stickers - with big word-by-word captions; the product only appears in a beat or two near the end, then a logo/CTA.&lt;/p&gt;&lt;p&gt;&lt;b&gt;Why it works:&lt;/b&gt; The &amp;#x27;brainrot&amp;#x27; edit pace makes it impossible to scroll past and lets a dry message (mechanism, comfort, ingredients) feel like entertainment; best for younger, meme-literate audiences and brands with a playful voice.&lt;/p&gt;&lt;p&gt;&lt;b&gt;How to make one:&lt;/b&gt; 1) Write a tight 20-45s VO or caption script for the product&amp;#x27;s one key claim (problem -&amp;gt; mechanism -&amp;gt; product). 2) Cut a visual every 1-2s that literally or absurdly illustrates each word (archival clips, movie/anime moments, stock disasters, stunts), with glitch/zoom transitions and bold word-by-word captions. 3) Land the product in the last 5-8s (founder or hand holding it) and end on logo + one-line CTA.&lt;/p&gt;&lt;p&gt;&lt;b&gt;Closest format already on the board:&lt;/b&gt; Reaction / Trend-Hijack (Borrowed Fame) - that borrows one existing viral clip or trend and reacts to it; here dozens of unrelated borrowed/absurd clips are spliced under your own VO as pure edit style.&lt;/p&gt;</textArea>
