<text x="96" y="9841" font-family="noto_sans" font-size="38" font-weight="bold" fill="#1a1a1a">N15  Video Static (Caption Over Looping B-roll)</text>
<rect x="96" y="9863" width="79" height="38" rx="19" fill="#c6dcff" stroke="none" data-content="&lt;b&gt;TOF&lt;/b&gt;" data-text-color="#305bab" data-font-size="18" data-font-family="noto_sans" />
<rect x="187" y="9863" width="300" height="38" rx="19" fill="#1a1a1a" stroke="none" data-content="&lt;b&gt;NEW · from 7-10 fig brands&lt;/b&gt;" data-text-color="#ffffff" data-font-size="18" data-font-family="noto_sans" />
<rect x="499" y="9863" width="290" height="38" rx="19" fill="#ffffff" stroke="#e7e7e7" data-content="&lt;b&gt;5 winning ads · 5 brands&lt;/b&gt;" data-text-color="#595959" data-font-size="18" data-font-family="noto_sans" />
<textArea x="96" y="9919" width="1900" height="359" font-family="noto_sans" font-size="21" fill="#595959">&lt;p&gt;&lt;b&gt;What it is:&lt;/b&gt; A 5-20s ad that is basically a static ad that moves: one silent, lo-fi b-roll loop of the product (pour, stir, fizz, held bottle) with a single headline or meme caption burned on top (sometimes a few benefit tags or a short rolling caption list), no voiceover or presenter, ending on the same shot or a quick product/offer card.&lt;/p&gt;&lt;p&gt;&lt;b&gt;Why it works:&lt;/b&gt; As cheap as a static image to make but plays as native video, so you can test dozens of headlines/angles fast; best for consumables and any product with a satisfying visual action.&lt;/p&gt;&lt;p&gt;&lt;b&gt;How to make one:&lt;/b&gt; 1) Film one 5-10s phone clip of the product&amp;#x27;s best action (pour, mix, open, spray, wear) in natural light. 2) Burn one strong headline on top (question, POV, &amp;#x27;X for less than $Y&amp;#x27;, relatable line) plus 2-4 small benefit/price tags if needed. 3) Export 3-10 versions with different headlines on the same loop and let spend pick the winner.&lt;/p&gt;&lt;p&gt;&lt;b&gt;Closest format already on the board:&lt;/b&gt; Text-Wall Story (Read-Along Still) - that is one still image carrying a long story; here it is a moving product loop with a single short headline, no story and no dwell-time read.&lt;/p&gt;</textArea>
