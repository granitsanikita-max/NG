<text x="96" y="5917" font-family="noto_sans" font-size="38" font-weight="bold" fill="#1a1a1a">N29  Limited Collab Drop (IP Trailer)</text>
<rect x="96" y="5939" width="131" height="38" rx="19" fill="#e3d7ff" stroke="none" data-content="&lt;b&gt;TOF→MOF&lt;/b&gt;" data-text-color="#5a3aa8" data-font-size="18" data-font-family="noto_sans" />
<rect x="239" y="5939" width="300" height="38" rx="19" fill="#1a1a1a" stroke="none" data-content="&lt;b&gt;NEW · from 7-10 fig brands&lt;/b&gt;" data-text-color="#ffffff" data-font-size="18" data-font-family="noto_sans" />
<rect x="551" y="5939" width="290" height="38" rx="19" fill="#ffffff" stroke="#e7e7e7" data-content="&lt;b&gt;5 winning ads · 4 brands&lt;/b&gt;" data-text-color="#595959" data-font-size="18" data-font-family="noto_sans" />
<textArea x="96" y="5995" width="1900" height="329" font-family="noto_sans" font-size="21" fill="#595959">&lt;p&gt;&lt;b&gt;What it is:&lt;/b&gt; A hype launch for a limited-edition product co-branded with a franchise or another brand: opens on the two logos locked up (&amp;#x27;X x Y&amp;#x27;, &amp;#x27;Limited Edition&amp;#x27;), shows the co-branded pack in the franchise&amp;#x27;s world with VFX/action beats and a quick product-in-use moment, and closes on a &amp;#x27;limited time only / before it&amp;#x27;s gone&amp;#x27; scarcity card.&lt;/p&gt;&lt;p&gt;&lt;b&gt;Why it works:&lt;/b&gt; Borrows a fandom&amp;#x27;s existing excitement and adds scarcity, so it pulls both fans and existing buyers into an urgent purchase; use for drops, seasonal editions and collabs.&lt;/p&gt;&lt;p&gt;&lt;b&gt;How to make one:&lt;/b&gt; 1) Create a limited edition (collab with a creator/brand/local artist, or a seasonal theme) and design a co-branded pack. 2) Open on the &amp;#x27;X x Y Limited Edition&amp;#x27; lockup, then 3-5 dramatic VFX/themed shots of the pack plus one quick use shot. 3) Close on &amp;#x27;Limited time only - gone when it&amp;#x27;s gone&amp;#x27; with the shop link.&lt;/p&gt;&lt;p&gt;&lt;b&gt;Closest format already on the board:&lt;/b&gt; Reaction / Trend-Hijack (Borrowed Fame): that disguises borrowed attention as native content; this is an official co-branded product launch trailer with a scarcity close.&lt;/p&gt;</textArea>
<rect x="96" y="6348" width="360" height="640" rx="8" fill="#1a1a1a" stroke="none" />
