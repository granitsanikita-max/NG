<rect x="2124" y="5939" width="131" height="38" rx="19" fill="#e3d7ff" stroke="none" data-content="&lt;b&gt;TOF→MOF&lt;/b&gt;" data-text-color="#5a3aa8" data-font-size="18" data-font-family="noto_sans" />
<rect x="2267" y="5939" width="300" height="38" rx="19" fill="#1a1a1a" stroke="none" data-content="&lt;b&gt;NEW · from 7-10 fig brands&lt;/b&gt;" data-text-color="#ffffff" data-font-size="18" data-font-family="noto_sans" />
<rect x="2579" y="5939" width="290" height="38" rx="19" fill="#ffffff" stroke="#e7e7e7" data-content="&lt;b&gt;5 winning ads · 3 brands&lt;/b&gt;" data-text-color="#595959" data-font-size="18" data-font-family="noto_sans" />
<textArea x="2124" y="5995" width="1900" height="329" font-family="noto_sans" font-size="21" fill="#595959">&lt;p&gt;&lt;b&gt;What it is:&lt;/b&gt; A cinematic 30s documentary vignette of one real, named person (athlete, mom, founder) with a name/title lower-third: they narrate their own life and routine in VO over observational footage, the product appears as part of that routine, and it closes on logo + tagline.&lt;/p&gt;&lt;p&gt;&lt;b&gt;Why it works:&lt;/b&gt; Feels like documentary truth rather than a testimonial pitch, so the claim rides on a real identity the viewer aspires to; great for supplements, fitness and performance products.&lt;/p&gt;&lt;p&gt;&lt;b&gt;How to make one:&lt;/b&gt; 1) Find one real customer with an aspirational identity (triathlete, busy mom, fighter) and record a 2-min audio interview about their routine. 2) Shoot observational b-roll of their day (training, kitchen, family) with the product used naturally; add a name/title lower-third early. 3) Cut the best 5-6 VO lines over the footage with small captions, end on logo + tagline.&lt;/p&gt;&lt;p&gt;&lt;b&gt;Closest format already on the board:&lt;/b&gt; UGC Testimonial / Personal Story: those are selfie talk-to-camera; this is a produced observational doc with VO and a named lower-third.&lt;/p&gt;</textArea>
