<text x="96" y="11251" font-family="noto_sans" font-size="38" font-weight="bold" fill="#1a1a1a">N17  Absurdist Visual Gag (One Surreal Shot)</text>
<rect x="96" y="11273" width="79" height="38" rx="19" fill="#c6dcff" stroke="none" data-content="&lt;b&gt;TOF&lt;/b&gt;" data-text-color="#305bab" data-font-size="18" data-font-family="noto_sans" />
<rect x="187" y="11273" width="300" height="38" rx="19" fill="#1a1a1a" stroke="none" data-content="&lt;b&gt;NEW · from 7-10 fig brands&lt;/b&gt;" data-text-color="#ffffff" data-font-size="18" data-font-family="noto_sans" />
<rect x="499" y="11273" width="290" height="38" rx="19" fill="#ffffff" stroke="#e7e7e7" data-content="&lt;b&gt;3 winning ads · 2 brands&lt;/b&gt;" data-text-color="#595959" data-font-size="18" data-font-family="noto_sans" />
<textArea x="96" y="11329" width="1900" height="298" font-family="noto_sans" font-size="21" fill="#595959">&lt;p&gt;&lt;b&gt;What it is:&lt;/b&gt; A single surreal, impossible staged image held for 6-10s: open mid-scene on the weird visual, a small pull-back or twist reveals the full gag, close with at most one caption and the product as the prop.&lt;/p&gt;&lt;p&gt;&lt;b&gt;Why it works:&lt;/b&gt; Cheap pattern-interrupt that stops the scroll on pure curiosity; best for brand-world building and retargeting creative refresh.&lt;/p&gt;&lt;p&gt;&lt;b&gt;How to make one:&lt;/b&gt; 1) Brainstorm one impossible image that ties to the product (bath in a truck bed, product playing on an old TV). 2) Shoot it cinematically in one location, 6-10s, with a slow reveal. 3) Add one short caption or none; keep the product visible but secondary.&lt;/p&gt;&lt;p&gt;&lt;b&gt;Closest format already on the board:&lt;/b&gt; Satisfying B-roll (Front-Splice) - also a visual scroll-stopper, but this is a staged surreal joke that IS the whole ad, not a splice before the pitch.&lt;/p&gt;</textArea>
<rect x="96" y="11651" width="360" height="640" rx="8" fill="#1a1a1a" stroke="none" />
<textArea x="96" y="12299" width="360" height="104" font-family="noto_sans" font-size="16" fill="#1a1a1a">&lt;p&gt;&lt;b&gt;1  Duke Cannon&lt;/b&gt;&lt;/p&gt;&lt;p&gt;Meta ad · 82 days live&lt;/p&gt;&lt;p&gt;&lt;a href="https://www.facebook.com/ads/library/?id=1720152652604613"&gt;▶ Ad Library&lt;/a&gt;  ·  &lt;a href="https://app.winninghunter.com/ad/1720152652604613?platform=meta"&gt;WH&lt;/a&gt;  ·  &lt;a href="https://drive.google.com/file/d/1AvztTndDtyi1S8uoDGoGN_v9COwQ5IxL/view"&gt;💾 Saved copy&lt;/a&gt;&lt;/p&gt;</textArea>
