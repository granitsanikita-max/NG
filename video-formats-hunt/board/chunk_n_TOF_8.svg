<rect x="2092" y="11181" width="1964" height="1254" rx="16" fill="#f7f7f7" stroke="none" />
<text x="2124" y="11251" font-family="noto_sans" font-size="38" font-weight="bold" fill="#1a1a1a">N18  Good-Deed Vlog (Giving It Away)</text>
<rect x="2124" y="11273" width="79" height="38" rx="19" fill="#c6dcff" stroke="none" data-content="&lt;b&gt;TOF&lt;/b&gt;" data-text-color="#305bab" data-font-size="18" data-font-family="noto_sans" />
<rect x="2215" y="11273" width="300" height="38" rx="19" fill="#1a1a1a" stroke="none" data-content="&lt;b&gt;NEW · from 7-10 fig brands&lt;/b&gt;" data-text-color="#ffffff" data-font-size="18" data-font-family="noto_sans" />
<rect x="2527" y="11273" width="290" height="38" rx="19" fill="#ffffff" stroke="#e7e7e7" data-content="&lt;b&gt;3 winning ads · 3 brands&lt;/b&gt;" data-text-color="#595959" data-font-size="18" data-font-family="noto_sans" />
<textArea x="2124" y="11329" width="1900" height="298" font-family="noto_sans" font-size="21" fill="#595959">&lt;p&gt;&lt;b&gt;What it is:&lt;/b&gt; The brand owner vlogs explaining the product in the shop, then delivers/donates it to a community hero group (e.g. a police K9 unit), filming the handover, the recipients&amp;#x27; thank-yous and why it matters, ending on the brand card.&lt;/p&gt;&lt;p&gt;&lt;b&gt;Why it works:&lt;/b&gt; Goodwill and a respected recipient make the brand likeable and quietly endorse the product&amp;#x27;s usefulness.&lt;/p&gt;&lt;p&gt;&lt;b&gt;How to make one:&lt;/b&gt; 1) Pick a sympathetic recipient that genuinely needs the product (rescue shelter, nurses, K9 unit, coaches). 2) Film the owner explaining the product, then the real handover and reactions in one continuous vlog. 3) Close with the recipients&amp;#x27; thanks and a soft brand/offer card.&lt;/p&gt;&lt;p&gt;&lt;b&gt;Closest format already on the board:&lt;/b&gt; Gift Reaction Reveal - that focuses on one person&amp;#x27;s emotional unwrap; this is an owner vlog of a donation to a community group, with the product explained along the way.&lt;/p&gt;</textArea>
<rect x="2124" y="11651" width="360" height="640" rx="8" fill="#1a1a1a" stroke="none" />
