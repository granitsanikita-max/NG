<text x="96" y="8462" font-family="noto_sans" font-size="38" font-weight="bold" fill="#1a1a1a">N13  Set Up With Me (Space Makeover)</text>
<rect x="96" y="8484" width="79" height="38" rx="19" fill="#c6dcff" stroke="none" data-content="&lt;b&gt;TOF&lt;/b&gt;" data-text-color="#305bab" data-font-size="18" data-font-family="noto_sans" />
