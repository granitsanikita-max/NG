<text x="2124" y="4538" font-family="noto_sans" font-size="38" font-weight="bold" fill="#1a1a1a">N28  GRWM (Get Ready With Me)</text>
<rect x="2124" y="4560" width="131" height="38" rx="19" fill="#e3d7ff" stroke="none" data-content="&lt;b&gt;TOF→MOF&lt;/b&gt;" data-text-color="#5a3aa8" data-font-size="18" data-font-family="noto_sans" />
<rect x="2267" y="4560" width="300" height="38" rx="19" fill="#1a1a1a" stroke="none" data-content="&lt;b&gt;NEW · from 7-10 fig brands&lt;/b&gt;" data-text-color="#ffffff" data-font-size="18" data-font-family="noto_sans" />
<rect x="2579" y="4560" width="290" height="38" rx="19" fill="#ffffff" stroke="#e7e7e7" data-content="&lt;b&gt;5 winning ads · 5 brands&lt;/b&gt;" data-text-color="#595959" data-font-size="18" data-font-family="noto_sans" />
<textArea x="2124" y="4616" width="1900" height="329" font-family="noto_sans" font-size="21" fill="#595959">&lt;p&gt;&lt;b&gt;What it is:&lt;/b&gt; Creator opens undone (robe, casual clothes, bare face) with a &amp;#x27;get ready / get dressed with me&amp;#x27; hook, chats or captions through each step as she applies or puts on the product (makeup, skincare, outfit), and ends on the finished look reveal, often with a walk-out or twirl.&lt;/p&gt;&lt;p&gt;&lt;b&gt;Why it works:&lt;/b&gt; The before-to-done arc is a built-in curiosity loop that holds viewers to the reveal, and the chatty native format lets the product be used naturally instead of pitched.&lt;/p&gt;&lt;p&gt;&lt;b&gt;How to make one:&lt;/b&gt; 1) Start the creator &amp;#x27;before&amp;#x27; (robe, messy hair, no makeup) on camera with a &amp;#x27;GRWM for ___&amp;#x27; text hook tied to an occasion. 2) Film each step of using the product in order with casual chat or captions (what it is, why she likes it); keep cuts quick. 3) End on the full reveal: final look, turn or walk-out, plus product/offer card.&lt;/p&gt;&lt;p&gt;&lt;b&gt;Closest format already on the board:&lt;/b&gt; UGC How-To - a how-to teaches usage step by step; GRWM is a native lifestyle ritual with chat, built around a transformation reveal and an occasion.&lt;/p&gt;</textArea>
