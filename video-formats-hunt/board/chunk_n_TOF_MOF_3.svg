<text x="96" y="4538" font-family="noto_sans" font-size="38" font-weight="bold" fill="#1a1a1a">N27  Fit Check (Single Outfit)</text>
<rect x="96" y="4560" width="131" height="38" rx="19" fill="#e3d7ff" stroke="none" data-content="&lt;b&gt;TOF→MOF&lt;/b&gt;" data-text-color="#5a3aa8" data-font-size="18" data-font-family="noto_sans" />
<rect x="239" y="4560" width="300" height="38" rx="19" fill="#1a1a1a" stroke="none" data-content="&lt;b&gt;NEW · from 7-10 fig brands&lt;/b&gt;" data-text-color="#ffffff" data-font-size="18" data-font-family="noto_sans" />
<rect x="551" y="4560" width="290" height="38" rx="19" fill="#ffffff" stroke="#e7e7e7" data-content="&lt;b&gt;5 winning ads · 5 brands&lt;/b&gt;" data-text-color="#595959" data-font-size="18" data-font-family="noto_sans" />
<textArea x="96" y="4616" width="1900" height="359" font-family="noto_sans" font-size="21" fill="#595959">&lt;p&gt;&lt;b&gt;What it is:&lt;/b&gt; Native phone-shot clip of one person in ONE complete outfit: opens mid-pose (mirror selfie, bedroom, doorway, street), then she turns, walks, twirls and shows front/back/detail to music, with a single relatable one-line caption (&amp;#x27;dinner and drinks fit&amp;#x27;, &amp;#x27;never taking these off&amp;#x27;, &amp;#x27;what I&amp;#x27;m wearing as a size 12&amp;#x27;). No talking, no demo, no multiple outfits.&lt;/p&gt;&lt;p&gt;&lt;b&gt;Why it works:&lt;/b&gt; It looks exactly like an organic TikTok/IG OOTD post, so it slips past ad blindness and shows true fit and movement on a real body; perfect for one hero garment.&lt;/p&gt;&lt;p&gt;&lt;b&gt;How to make one:&lt;/b&gt; 1) Put one creator in the full outfit (hero product + simple styling) in a real home/street spot; film handheld or propped phone, 8-15s. 2) Capture walk-in, slow turn, back view, hand-on-fabric detail and a confident end pose, cut to a trending sound. 3) Add one native-style caption line (POV / occasion / size), no logo until the end or watermark only.&lt;/p&gt;&lt;p&gt;&lt;b&gt;Closest format already on the board:&lt;/b&gt; Try-On Haul - a haul shows several pieces back to back; a fit check commits the whole ad to one outfit with no talking.&lt;/p&gt;</textArea>
<rect x="96" y="4999" width="360" height="640" rx="8" fill="#1a1a1a" stroke="none" />
