<rect data-type="frame" x="0" y="0" width="4120" height="13827" fill="#ffffff" data-title="NEW · Top of Funnel" />
<text x="64" y="131" font-family="noto_sans" font-size="67" font-weight="bold" fill="#1a1a1a">NEW · Top of Funnel</text>
<text x="64" y="191" font-family="noto_sans" font-size="32" fill="#595959">Cold audiences. Stop the scroll and earn attention.  (20 new formats)</text>
<rect x="64" y="300" width="1964" height="1315" rx="16" fill="#f7f7f7" stroke="none" />
<text x="96" y="370" font-family="noto_sans" font-size="38" font-weight="bold" fill="#1a1a1a">N1  Aesthetic Room Tour (Styled Space Walkthrough)</text>
<rect x="96" y="392" width="79" height="38" rx="19" fill="#c6dcff" stroke="none" data-content="&lt;b&gt;TOF&lt;/b&gt;" data-text-color="#305bab" data-font-size="18" data-font-family="noto_sans" />
<rect x="187" y="392" width="300" height="38" rx="19" fill="#1a1a1a" stroke="none" data-content="&lt;b&gt;NEW · from 7-10 fig brands&lt;/b&gt;" data-text-color="#ffffff" data-font-size="18" data-font-family="noto_sans" />
<rect x="499" y="392" width="290" height="38" rx="19" fill="#ffffff" stroke="#e7e7e7" data-content="&lt;b&gt;5 winning ads · 3 brands&lt;/b&gt;" data-text-color="#595959" data-font-size="18" data-font-family="noto_sans" />
<textArea x="96" y="448" width="1900" height="359" font-family="noto_sans" font-size="21" fill="#595959">&lt;p&gt;&lt;b&gt;What it is:&lt;/b&gt; A silent, music-led handheld/gimbal walkthrough of one beautifully styled room or home: opens on a &amp;#x27;pov: the life I want&amp;#x27; / &amp;#x27;small bedrooms can still be beautiful&amp;#x27; caption over a wide shot, glides past details (bed, lamp, shelves, textures), and closes on the full room with a &amp;#x27;shop the look&amp;#x27; line.&lt;/p&gt;&lt;p&gt;&lt;b&gt;Why it works:&lt;/b&gt; It sells the aspirational lifestyle, not the item; the viewer wants the whole room and the products come with it. Works for home decor, furniture and bedding brands with an influencer-styled space.&lt;/p&gt;&lt;p&gt;&lt;b&gt;How to make one:&lt;/b&gt; 1) Style one room fully with your products (or partner with a home influencer whose room already looks great). 2) Shoot slow gimbal glides and detail close-ups in warm golden light, with a short aspirational POV caption on top. 3) Cut to trending calm music, end on the hero wide shot with &amp;#x27;shop the collection&amp;#x27; or a price/offer line.&lt;/p&gt;&lt;p&gt;&lt;b&gt;Closest format already on the board:&lt;/b&gt; Day In The Life / Satisfying B-roll - no person&amp;#x27;s routine or random b-roll here; the whole ad is a guided tour of a styled room as the aspiration.&lt;/p&gt;</textArea>
<rect x="96" y="831" width="360" height="640" rx="8" fill="#1a1a1a" stroke="none" />
