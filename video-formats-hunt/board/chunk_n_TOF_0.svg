<text x="2124" y="370" font-family="noto_sans" font-size="38" font-weight="bold" fill="#1a1a1a">N2  Animated Character Story (Pixar / Cartoon)</text>
<rect x="2124" y="392" width="79" height="38" rx="19" fill="#c6dcff" stroke="none" data-content="&lt;b&gt;TOF&lt;/b&gt;" data-text-color="#305bab" data-font-size="18" data-font-family="noto_sans" />
<rect x="2215" y="392" width="300" height="38" rx="19" fill="#1a1a1a" stroke="none" data-content="&lt;b&gt;NEW · from 7-10 fig brands&lt;/b&gt;" data-text-color="#ffffff" data-font-size="18" data-font-family="noto_sans" />
<rect x="2527" y="392" width="290" height="38" rx="19" fill="#ffffff" stroke="#e7e7e7" data-content="&lt;b&gt;5 winning ads · 5 brands&lt;/b&gt;" data-text-color="#595959" data-font-size="18" data-font-family="noto_sans" />
<textArea x="2124" y="448" width="1900" height="359" font-family="noto_sans" font-size="21" fill="#595959">&lt;p&gt;&lt;b&gt;What it is:&lt;/b&gt; The whole ad is a short animated story (Pixar-style 3D or hand-drawn 2D picture book) with a human or pet protagonist: opens on the character living the problem, middle shows failed fixes then discovering the product, close shows the happy &amp;#x27;after&amp;#x27; and a product end card.&lt;/p&gt;&lt;p&gt;&lt;b&gt;Why it works:&lt;/b&gt; Cartoon storytelling stops the scroll, lets you dramatize embarrassing or invisible problems (bloating, acne, a sick dog) without real actors, and is cheap to make with AI video.&lt;/p&gt;&lt;p&gt;&lt;b&gt;How to make one:&lt;/b&gt; 1) Write a 30-60s first- or third-person story: problem moment, what they tried that failed, discovery of the product, life after. 2) Generate a consistent Pixar-style or storybook character and animate each beat as a scene, with captions/voiceover. 3) Show the real product clearly at the discovery beat and end on a product card with offer.&lt;/p&gt;&lt;p&gt;&lt;b&gt;Closest format already on the board:&lt;/b&gt; Claymation / Talking Objects - Claymation is a different style and Talking Objects has the product or body part narrating; here an animated person/pet acts out a problem-to-solution story.&lt;/p&gt;</textArea>
