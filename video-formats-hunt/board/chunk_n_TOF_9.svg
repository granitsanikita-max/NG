<rect x="64" y="12499" width="1964" height="1224" rx="16" fill="#f7f7f7" stroke="none" />
<text x="96" y="12569" font-family="noto_sans" font-size="38" font-weight="bold" fill="#1a1a1a">N19  Party Game Play-Along</text>
<rect x="96" y="12591" width="79" height="38" rx="19" fill="#c6dcff" stroke="none" data-content="&lt;b&gt;TOF&lt;/b&gt;" data-text-color="#305bab" data-font-size="18" data-font-family="noto_sans" />
<rect x="187" y="12591" width="300" height="38" rx="19" fill="#1a1a1a" stroke="none" data-content="&lt;b&gt;NEW · from 7-10 fig brands&lt;/b&gt;" data-text-color="#ffffff" data-font-size="18" data-font-family="noto_sans" />
<rect x="499" y="12591" width="290" height="38" rx="19" fill="#ffffff" stroke="#e7e7e7" data-content="&lt;b&gt;2 winning ads · 1 brand&lt;/b&gt;" data-text-color="#595959" data-font-size="18" data-font-family="noto_sans" />
<textArea x="96" y="12647" width="1900" height="268" font-family="noto_sans" font-size="21" fill="#595959">&lt;p&gt;&lt;b&gt;What it is:&lt;/b&gt; Friends at a table play a real party game (Wavelength dial, red flag/green flag) re-skinned with prompts about the product category: open on the game title, middle is 1-2 min of banter and laughs as they debate prompts, close with the product as the answer/punchline.&lt;/p&gt;&lt;p&gt;&lt;b&gt;Why it works:&lt;/b&gt; Long, fun watch time and natural objection-handling through banter; great for awkward or taboo categories.&lt;/p&gt;&lt;p&gt;&lt;b&gt;How to make one:&lt;/b&gt; 1) Pick a known game format and write 8-10 prompts about your niche&amp;#x27;s habits and objections. 2) Film 2-3 friends playing unscripted with a light brand bug on screen. 3) Cut to the best moments; let the product win the last prompt.&lt;/p&gt;&lt;p&gt;&lt;b&gt;Closest format already on the board:&lt;/b&gt; Episodic Series / Social Show - also show-like, but this is one self-contained game round with category prompts, not a recurring series.&lt;/p&gt;</textArea>
<rect x="96" y="12939" width="360" height="640" rx="8" fill="#1a1a1a" stroke="none" />
<textArea x="96" y="13587" width="360" height="104" font-family="noto_sans" font-size="16" fill="#1a1a1a">&lt;p&gt;&lt;b&gt;1  TUSHY&lt;/b&gt;&lt;/p&gt;&lt;p&gt;Meta ad · 240 days live&lt;/p&gt;&lt;p&gt;&lt;a href="https://www.facebook.com/ads/library/?id=1464183438566930"&gt;▶ Ad Library&lt;/a&gt;  ·  &lt;a href="https://app.winninghunter.com/ad/1464183438566930?platform=meta"&gt;WH&lt;/a&gt;  ·  &lt;a href="https://drive.google.com/file/d/1NkqEjIXl9PZzZLQ-lEYGtyO1sdt25__J/view"&gt;💾 Saved copy&lt;/a&gt;&lt;/p&gt;</textArea>
