<textArea x="480" y="13587" width="360" height="104" font-family="noto_sans" font-size="16" fill="#1a1a1a">&lt;p&gt;&lt;b&gt;2  TUSHY&lt;/b&gt;&lt;/p&gt;&lt;p&gt;Meta ad · 221 days live&lt;/p&gt;&lt;p&gt;&lt;a href="https://www.facebook.com/ads/library/?id=1302094391966340"&gt;▶ Ad Library&lt;/a&gt;  ·  &lt;a href="https://app.winninghunter.com/ad/1302094391966340?platform=meta"&gt;WH&lt;/a&gt;  ·  &lt;a href="https://drive.google.com/file/d/1iUKhzB4UHtkP34nHF_vDKIK8DqXUPJq-/view"&gt;💾 Saved copy&lt;/a&gt;&lt;/p&gt;</textArea>
<rect x="2092" y="12499" width="1964" height="1224" rx="16" fill="#f7f7f7" stroke="none" />
<text x="2124" y="12569" font-family="noto_sans" font-size="38" font-weight="bold" fill="#1a1a1a">N20  Prank Skit (Product Used On A Friend)</text>
<rect x="2124" y="12591" width="79" height="38" rx="19" fill="#c6dcff" stroke="none" data-content="&lt;b&gt;TOF&lt;/b&gt;" data-text-color="#305bab" data-font-size="18" data-font-family="noto_sans" />
<rect x="2215" y="12591" width="300" height="38" rx="19" fill="#1a1a1a" stroke="none" data-content="&lt;b&gt;NEW · from 7-10 fig brands&lt;/b&gt;" data-text-color="#ffffff" data-font-size="18" data-font-family="noto_sans" />
<rect x="2527" y="12591" width="290" height="38" rx="19" fill="#ffffff" stroke="#e7e7e7" data-content="&lt;b&gt;2 winning ads · 2 brands&lt;/b&gt;" data-text-color="#595959" data-font-size="18" data-font-family="noto_sans" />
<textArea x="2124" y="12647" width="1900" height="268" font-family="noto_sans" font-size="21" fill="#595959">&lt;p&gt;&lt;b&gt;What it is:&lt;/b&gt; Lo-fi handheld prank: open on a caption like &amp;#x27;lasering my roommate&amp;#x27;s stuff&amp;#x27; or sneaking up on a sleeping friend, middle is the product used on the unaware victim (often a quick montage), close on the victim&amp;#x27;s reaction or &amp;#x27;what should I do next?&amp;#x27;.&lt;/p&gt;&lt;p&gt;&lt;b&gt;Why it works:&lt;/b&gt; Prank content is natively shareable and demos the product in a fun, real-world way for cold audiences.&lt;/p&gt;&lt;p&gt;&lt;b&gt;How to make one:&lt;/b&gt; 1) Pick a harmless prank only your product can do (engrave their things, blast cold air on them). 2) Film handheld, secretive, 15-60s; montage several &amp;#x27;victims&amp;#x27; or items. 3) End on the reaction and a comment-bait question.&lt;/p&gt;&lt;p&gt;&lt;b&gt;Closest format already on the board:&lt;/b&gt; Product Demo Ads - shows the product working, but framed as a prank on a friend with a reaction payoff.&lt;/p&gt;</textArea>
<rect x="2124" y="12939" width="360" height="640" rx="8" fill="#1a1a1a" stroke="none" />
