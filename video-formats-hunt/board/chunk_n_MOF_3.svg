<text x="96" y="4447" font-family="noto_sans" font-size="38" font-weight="bold" fill="#1a1a1a">N44  Prop Analogy Explainer (Physical Mechanism Demo)</text>
<rect x="96" y="4469" width="79" height="38" rx="19" fill="#fff6b6" stroke="none" data-content="&lt;b&gt;MOF&lt;/b&gt;" data-text-color="#8a6300" data-font-size="18" data-font-family="noto_sans" />
<rect x="187" y="4469" width="300" height="38" rx="19" fill="#1a1a1a" stroke="none" data-content="&lt;b&gt;NEW · from 7-10 fig brands&lt;/b&gt;" data-text-color="#ffffff" data-font-size="18" data-font-family="noto_sans" />
<rect x="499" y="4469" width="290" height="38" rx="19" fill="#ffffff" stroke="#e7e7e7" data-content="&lt;b&gt;5 winning ads · 4 brands&lt;/b&gt;" data-text-color="#595959" data-font-size="18" data-font-family="noto_sans" />
<textArea x="96" y="4525" width="1900" height="390" font-family="noto_sans" font-size="21" fill="#595959">&lt;p&gt;&lt;b&gt;What it is:&lt;/b&gt; An expert in a white coat (or just hands) explains how the problem works using an everyday object as a stand-in for the body: opens on the prop and a hook (&amp;#x27;nobody wants to be the short kid&amp;#x27;, &amp;#x27;double cleansing: scam?&amp;#x27;), the middle acts the mechanism out on the prop (orange peel = pores, tube = urethra, pool noodle = growth plate, straw = blood vessel), and it closes with the product as the fix plus offer.&lt;/p&gt;&lt;p&gt;&lt;b&gt;Why it works:&lt;/b&gt; A physical analogy makes an invisible mechanism instantly understandable and believable, and the odd prop is a pattern-interrupt hook; best for supplements, skincare and health devices.&lt;/p&gt;&lt;p&gt;&lt;b&gt;How to make one:&lt;/b&gt; 1) Pick one cheap prop that mirrors the body part or problem (fruit for skin, hose for veins, sponge for gut lining). 2) Script 30-60s where every claim is shown on the prop: the problem happening, why common fixes fail, what your product&amp;#x27;s ingredient does. 3) Bring the product into frame next to the prop for the fix, then end with the offer.&lt;/p&gt;&lt;p&gt;&lt;b&gt;Closest format already on the board:&lt;/b&gt; Fake Doctor / Animated Mechanism Explainer - Fake Doctor is a spoken endorsement and the Mechanism Explainer is animation; here the mechanism is acted out on a physical everyday prop, with or without a presenter.&lt;/p&gt;</textArea>
