<text x="2124" y="4447" font-family="noto_sans" font-size="38" font-weight="bold" fill="#1a1a1a">N45  Styling Remix (One Piece, Many Looks)</text>
<rect x="2124" y="4469" width="79" height="38" rx="19" fill="#fff6b6" stroke="none" data-content="&lt;b&gt;MOF&lt;/b&gt;" data-text-color="#8a6300" data-font-size="18" data-font-family="noto_sans" />
<rect x="2215" y="4469" width="300" height="38" rx="19" fill="#1a1a1a" stroke="none" data-content="&lt;b&gt;NEW · from 7-10 fig brands&lt;/b&gt;" data-text-color="#ffffff" data-font-size="18" data-font-family="noto_sans" />
<rect x="2527" y="4469" width="290" height="38" rx="19" fill="#ffffff" stroke="#e7e7e7" data-content="&lt;b&gt;5 winning ads · 5 brands&lt;/b&gt;" data-text-color="#595959" data-font-size="18" data-font-family="noto_sans" />
<textArea x="2124" y="4525" width="1900" height="268" font-family="noto_sans" font-size="21" fill="#595959">&lt;p&gt;&lt;b&gt;What it is:&lt;/b&gt; One hero item styled into several different outfits: opens with the item and a hook (&amp;#x27;One skirt. Three lives&amp;#x27;, &amp;#x27;How I style my favourite boots&amp;#x27;), cuts outfit by outfit with an occasion label each (school drop-off, lunch date, night out), and ends on &amp;#x27;which is your favourite?&amp;#x27; or the product end card.&lt;/p&gt;&lt;p&gt;&lt;b&gt;Why it works:&lt;/b&gt; Sells versatility and cost-per-wear, which kills the &amp;#x27;where would I even wear it&amp;#x27; objection for a single mid-priced piece.&lt;/p&gt;&lt;p&gt;&lt;b&gt;How to make one:&lt;/b&gt; 1) Pick one hero piece and plan 3-5 outfits around it for distinct occasions. 2) Film same spot, same framing; open on the item in hand + hook text, then quick-cut each look with an occasion label. 3) Close with &amp;#x27;Which is your favourite?&amp;#x27; or the product name card and offer.&lt;/p&gt;&lt;p&gt;&lt;b&gt;Closest format already on the board:&lt;/b&gt; Try-On Haul - a haul shows many different products; a remix keeps ONE product constant and changes everything around it.&lt;/p&gt;</textArea>
