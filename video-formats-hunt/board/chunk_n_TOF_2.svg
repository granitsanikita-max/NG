<text x="96" y="3098" font-family="noto_sans" font-size="38" font-weight="bold" fill="#1a1a1a">N5  Cinematic Mini-Film (Brand Short Story)</text>
<rect x="96" y="3120" width="79" height="38" rx="19" fill="#c6dcff" stroke="none" data-content="&lt;b&gt;TOF&lt;/b&gt;" data-text-color="#305bab" data-font-size="18" data-font-family="noto_sans" />
<rect x="187" y="3120" width="300" height="38" rx="19" fill="#1a1a1a" stroke="none" data-content="&lt;b&gt;NEW · from 7-10 fig brands&lt;/b&gt;" data-text-color="#ffffff" data-font-size="18" data-font-family="noto_sans" />
<rect x="499" y="3120" width="290" height="38" rx="19" fill="#ffffff" stroke="#e7e7e7" data-content="&lt;b&gt;5 winning ads · 5 brands&lt;/b&gt;" data-text-color="#595959" data-font-size="18" data-font-family="noto_sans" />
<textArea x="96" y="3176" width="1900" height="298" font-family="noto_sans" font-size="21" fill="#595959">&lt;p&gt;&lt;b&gt;What it is:&lt;/b&gt; A 10-40s film-style micro story with a character, a setting and a small plot (a bellhop loads the bag, a man hunts the sea for his underwear, a kid&amp;#x27;s fingerprint becomes mom&amp;#x27;s necklace): the product is a prop inside the scene, there is no pitch or VO, and it ends on a title-card style logo.&lt;/p&gt;&lt;p&gt;&lt;b&gt;Why it works:&lt;/b&gt; Feels like a film scene, not an ad, so it earns attention and brand intrigue; works for fashion, gifting and lifestyle products with a strong aesthetic.&lt;/p&gt;&lt;p&gt;&lt;b&gt;How to make one:&lt;/b&gt; 1) Write a 3-beat scene (setup, small twist/action, payoff) where the product is the object the character wants or uses. 2) Shoot it like cinema: one location, styled cast, slow camera, natural sound or one music cue, no talking to camera. 3) End on a title card with the brand name (like a film title) instead of a hard offer.&lt;/p&gt;&lt;p&gt;&lt;b&gt;Closest format already on the board:&lt;/b&gt; Scenarios / Day In The Life: those are creator-native or hypothetical; this is a scripted cinematic scene with a micro plot and a film title-card close.&lt;/p&gt;</textArea>
<rect x="96" y="3498" width="360" height="640" rx="8" fill="#1a1a1a" stroke="none" />
