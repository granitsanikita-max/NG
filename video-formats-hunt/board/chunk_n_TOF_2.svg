<rect x="2092" y="3028" width="1964" height="1254" rx="16" fill="#f7f7f7" stroke="none" />
<text x="2124" y="3098" font-family="noto_sans" font-size="38" font-weight="bold" fill="#1a1a1a">N6  IRL Brand Stunt (Street Activation Recap)</text>
<rect x="2124" y="3120" width="79" height="38" rx="19" fill="#c6dcff" stroke="none" data-content="&lt;b&gt;TOF&lt;/b&gt;" data-text-color="#305bab" data-font-size="18" data-font-family="noto_sans" />
<rect x="2215" y="3120" width="300" height="38" rx="19" fill="#1a1a1a" stroke="none" data-content="&lt;b&gt;NEW · from 7-10 fig brands&lt;/b&gt;" data-text-color="#ffffff" data-font-size="18" data-font-family="noto_sans" />
<rect x="2527" y="3120" width="290" height="38" rx="19" fill="#ffffff" stroke="#e7e7e7" data-content="&lt;b&gt;5 winning ads · 5 brands&lt;/b&gt;" data-text-color="#595959" data-font-size="18" data-font-family="noto_sans" />
<textArea x="2124" y="3176" width="1900" height="268" font-family="noto_sans" font-size="21" fill="#595959">&lt;p&gt;&lt;b&gt;What it is:&lt;/b&gt; Documentary-style recap of a real-world stunt the brand staged: open on the strange public moment (posters with tear-off samples, costumed bellhops, a medieval troupe), middle shows passers-by reacting and engaging, close on the product reveal and brand card.&lt;/p&gt;&lt;p&gt;&lt;b&gt;Why it works:&lt;/b&gt; Real-world spectacle feels like news, not an ad, and makes a small brand look big and culturally present.&lt;/p&gt;&lt;p&gt;&lt;b&gt;How to make one:&lt;/b&gt; 1) Plan one cheap physical stunt tied to the product (sample tear-off posters, costumed staff handing it out). 2) Film it handheld/documentary style with real bystander reactions. 3) Cut to 15-30s: stunt -&amp;gt; reactions -&amp;gt; product reveal -&amp;gt; logo.&lt;/p&gt;&lt;p&gt;&lt;b&gt;Closest format already on the board:&lt;/b&gt; Street Interviews - also filmed in public, but here the brand stages a stunt and films reactions instead of asking questions.&lt;/p&gt;</textArea>
<rect x="2124" y="3468" width="360" height="640" rx="8" fill="#1a1a1a" stroke="none" />
