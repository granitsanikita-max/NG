<text x="96" y="5857" font-family="noto_sans" font-size="38" font-weight="bold" fill="#1a1a1a">N46  Trade-Show Booth Demo</text>
<rect x="96" y="5879" width="79" height="38" rx="19" fill="#fff6b6" stroke="none" data-content="&lt;b&gt;MOF&lt;/b&gt;" data-text-color="#8a6300" data-font-size="18" data-font-family="noto_sans" />
<rect x="187" y="5879" width="300" height="38" rx="19" fill="#1a1a1a" stroke="none" data-content="&lt;b&gt;NEW · from 7-10 fig brands&lt;/b&gt;" data-text-color="#ffffff" data-font-size="18" data-font-family="noto_sans" />
<rect x="499" y="5879" width="290" height="38" rx="19" fill="#ffffff" stroke="#e7e7e7" data-content="&lt;b&gt;5 winning ads · 5 brands&lt;/b&gt;" data-text-color="#595959" data-font-size="18" data-font-family="noto_sans" />
<textArea x="96" y="5935" width="1900" height="298" font-family="noto_sans" font-size="21" fill="#595959">&lt;p&gt;&lt;b&gt;What it is:&lt;/b&gt; Founder/rep with a lanyard filmed at an expo booth (banners, crowd) pitching and demoing the product live to camera, intercut with bold spec cards and a &amp;#x27;NEW&amp;#x27; badge, closing on the rep summing up and the brand card.&lt;/p&gt;&lt;p&gt;&lt;b&gt;Why it works:&lt;/b&gt; The expo setting signals a real, industry-recognised launch and makes a pitch feel like news coverage rather than an ad.&lt;/p&gt;&lt;p&gt;&lt;b&gt;How to make one:&lt;/b&gt; 1) Film at a trade show, pop-up or market stall with branded backdrop - rep demos the product live. 2) Intercut 3-4 full-screen spec cards (key numbers) between demo shots, add a &amp;#x27;NEW&amp;#x27; sticker. 3) End with the rep&amp;#x27;s one-line summary to camera + logo card.&lt;/p&gt;&lt;p&gt;&lt;b&gt;Closest format already on the board:&lt;/b&gt; Stage Talk / Keynote Authority - no stage or audience lecture; it is a hands-on booth demo with spec cards, closer to a news segment from the show floor.&lt;/p&gt;</textArea>
