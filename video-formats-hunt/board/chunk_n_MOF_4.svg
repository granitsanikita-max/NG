<text x="2124" y="5857" font-family="noto_sans" font-size="38" font-weight="bold" fill="#1a1a1a">N47  YouTube Reviewer Clip (Borrowed Expert)</text>
<rect x="2124" y="5879" width="79" height="38" rx="19" fill="#fff6b6" stroke="none" data-content="&lt;b&gt;MOF&lt;/b&gt;" data-text-color="#8a6300" data-font-size="18" data-font-family="noto_sans" />
<rect x="2215" y="5879" width="300" height="38" rx="19" fill="#1a1a1a" stroke="none" data-content="&lt;b&gt;NEW · from 7-10 fig brands&lt;/b&gt;" data-text-color="#ffffff" data-font-size="18" data-font-family="noto_sans" />
<rect x="2527" y="5879" width="290" height="38" rx="19" fill="#ffffff" stroke="#e7e7e7" data-content="&lt;b&gt;5 winning ads · 5 brands&lt;/b&gt;" data-text-color="#595959" data-font-size="18" data-font-family="noto_sans" />
<textArea x="2124" y="5935" width="1900" height="298" font-family="noto_sans" font-size="21" fill="#595959">&lt;p&gt;&lt;b&gt;What it is:&lt;/b&gt; A horizontal, letterboxed excerpt from an independent long-form YouTube reviewer: often opens on a YouTube-style thumbnail hook, then the reviewer talks through and handles the product with screen recordings/specs, with a branded header bar, closing on &amp;#x27;see full review on YouTube&amp;#x27; or a shop end card.&lt;/p&gt;&lt;p&gt;&lt;b&gt;Why it works:&lt;/b&gt; An independent niche expert&amp;#x27;s real review carries authority no brand claim has; the YouTube look signals unsponsored, in-depth content.&lt;/p&gt;&lt;p&gt;&lt;b&gt;How to make one:&lt;/b&gt; 1) Send product to niche YouTubers and license a 30-80s segment of their review. 2) Keep it horizontal with black bars, add a product-name header and burned-in captions; optional thumbnail-style opener. 3) Close with end card or &amp;#x27;full review on YouTube + discount code&amp;#x27;.&lt;/p&gt;&lt;p&gt;&lt;b&gt;Closest format already on the board:&lt;/b&gt; Celebrity Podcast Clip / UGC Reviews - this borrows a niche YouTube reviewer&amp;#x27;s long-form review (letterboxed), not a famous podcast or a vertical UGC creator.&lt;/p&gt;</textArea>
