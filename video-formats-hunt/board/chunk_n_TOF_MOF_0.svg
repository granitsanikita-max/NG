<text x="64" y="191" font-family="noto_sans" font-size="32" fill="#595959">Cold-to-warm. Entertain or inspire, then start selling.  (17 new formats)</text>
<rect x="64" y="300" width="1964" height="1346" rx="16" fill="#f7f7f7" stroke="none" />
<text x="96" y="370" font-family="noto_sans" font-size="38" font-weight="bold" fill="#1a1a1a">N21  AI Story VSL (Cinematic Caption Story)</text>
<rect x="96" y="392" width="131" height="38" rx="19" fill="#e3d7ff" stroke="none" data-content="&lt;b&gt;TOF→MOF&lt;/b&gt;" data-text-color="#5a3aa8" data-font-size="18" data-font-family="noto_sans" />
<rect x="239" y="392" width="300" height="38" rx="19" fill="#1a1a1a" stroke="none" data-content="&lt;b&gt;NEW · from 7-10 fig brands&lt;/b&gt;" data-text-color="#ffffff" data-font-size="18" data-font-family="noto_sans" />
<rect x="551" y="392" width="290" height="38" rx="19" fill="#ffffff" stroke="#e7e7e7" data-content="&lt;b&gt;5 winning ads · 3 brands&lt;/b&gt;" data-text-color="#595959" data-font-size="18" data-font-family="noto_sans" />
<textArea x="96" y="448" width="1900" height="390" font-family="noto_sans" font-size="21" fill="#595959">&lt;p&gt;&lt;b&gt;What it is:&lt;/b&gt; A 45-120s story-VSL told entirely through AI-generated, film-look scenes with burned-in captions (often with VO): it opens on a humiliating or emotional moment from the buyer&amp;#x27;s or spouse&amp;#x27;s point of view (&amp;#x27;At 43 I had to ask for an XXL&amp;#x27;, &amp;#x27;My wife came home and froze&amp;#x27;), shows the struggle and failed fixes, reveals the hidden cause with a 3D mechanism shot, then the product, the transformation scenes and a guarantee/offer close. No real presenter carries the ad.&lt;/p&gt;&lt;p&gt;&lt;b&gt;Why it works:&lt;/b&gt; Gets the emotional pull of a long advertorial story with cinematic visuals you could never afford to shoot; best for problem-aware supplements and health/wellness products with a &amp;#x27;hidden cause&amp;#x27; angle.&lt;/p&gt;&lt;p&gt;&lt;b&gt;How to make one:&lt;/b&gt; 1) Write a 60-90s first-person (or spouse&amp;#x27;s) story script: embarrassing moment -&amp;gt; &amp;#x27;I was doing everything right&amp;#x27; -&amp;gt; real hidden cause -&amp;gt; product -&amp;gt; life after -&amp;gt; guarantee. 2) Generate one consistent AI character across 10-15 cinematic scenes plus 1-2 3D mechanism shots (organ/cell glow), and burn each script line on as a caption. 3) Close on real product-in-hand footage and the offer (guarantee, bundle, &amp;#x27;link below&amp;#x27;).&lt;/p&gt;&lt;p&gt;&lt;b&gt;Closest format already on the board:&lt;/b&gt; Personal Story [TOF,MOF] - same story arc, but here no creator is on camera: the whole story is acted out in AI cinematic scenes with captions/VO, plus a built-in mechanism reveal like a VSL.&lt;/p&gt;</textArea>
