<rect x="2092" y="300" width="1964" height="1346" rx="16" fill="#f7f7f7" stroke="none" />
<text x="2124" y="370" font-family="noto_sans" font-size="38" font-weight="bold" fill="#1a1a1a">N22  BTS vs Final Shot Reveal</text>
<rect x="2124" y="392" width="131" height="38" rx="19" fill="#e3d7ff" stroke="none" data-content="&lt;b&gt;TOF→MOF&lt;/b&gt;" data-text-color="#5a3aa8" data-font-size="18" data-font-family="noto_sans" />
<rect x="2267" y="392" width="300" height="38" rx="19" fill="#1a1a1a" stroke="none" data-content="&lt;b&gt;NEW · from 7-10 fig brands&lt;/b&gt;" data-text-color="#ffffff" data-font-size="18" data-font-family="noto_sans" />
<rect x="2579" y="392" width="290" height="38" rx="19" fill="#ffffff" stroke="#e7e7e7" data-content="&lt;b&gt;5 winning ads · 3 brands&lt;/b&gt;" data-text-color="#595959" data-font-size="18" data-font-family="noto_sans" />
<textArea x="2124" y="448" width="1900" height="298" font-family="noto_sans" font-size="21" fill="#595959">&lt;p&gt;&lt;b&gt;What it is:&lt;/b&gt; Opens on the raw behind-the-scenes setup (rig, tripod, suction mount, studio) capturing a shot, then cuts to the polished final footage it produced, alternating setup vs result a few times and ending on the brand card.&lt;/p&gt;&lt;p&gt;&lt;b&gt;Why it works:&lt;/b&gt; Proves the product&amp;#x27;s output quality directly - the viewer sees exactly what they&amp;#x27;d get - ideal for tools that produce a result (camera gear, lighting, editing, beauty tools).&lt;/p&gt;&lt;p&gt;&lt;b&gt;How to make one:&lt;/b&gt; 1) Film the product set up doing its job in a plain/messy real environment (the &amp;#x27;how&amp;#x27;). 2) Capture or render the clean final result it produces (the &amp;#x27;wow&amp;#x27;). 3) Cut setup &amp;gt; result 2-4 times with a &amp;#x27;POV: no crew, just this&amp;#x27; caption, end on product + offer.&lt;/p&gt;&lt;p&gt;&lt;b&gt;Closest format already on the board:&lt;/b&gt; Product Demo Ads - a demo shows use; this hinges on the contrast reveal between the scrappy setup and the polished output it created.&lt;/p&gt;</textArea>
